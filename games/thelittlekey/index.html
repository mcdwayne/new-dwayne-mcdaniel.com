/* One painted VGA scene, one caption, three buttons. No menus: you click to live through a key's life,
   and when the key is copied you choose which key to follow. */
:root{
  --frame:#120E1C; --bar:#8E8A9E; --bar-hi:#D6D2E2; --bar-lo:#4A4658; --bar-ink:#0E0B16;
  --win:#F2E8CF; --win-ink:#1C140A; --win-edge:#6B4A1E; --win-gold:#C9A04A; --accent:#7A1F1F; --narr:#4A3A1E;
  --f-text:"Comic Sans MS","Comic Sans","Comic Neue",cursive; --f-term:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--frame);color:#EEE}
body{margin:0;font:17px/1.4 var(--f-text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{font:inherit}
:focus-visible{outline:3px solid #FFE27A;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.status{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;background:var(--bar);color:var(--bar-ink);padding:3px 10px;font:22px/1.05 var(--f-term);flex-wrap:wrap;border:2px solid;border-color:var(--bar-hi) var(--bar-lo) var(--bar-lo) var(--bar-hi)}
.strip{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.rg{position:relative;padding:0;border:1px solid var(--bar-lo);background:none;cursor:pointer;line-height:0}
.rg canvas{width:26px;height:26px;image-rendering:pixelated;display:block}
.rg.found:hover,.rg:focus-visible{border-color:#FFE27A}
.rg .tip{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:30;width:max-content;max-width:min(260px,80vw);
  background:var(--win);color:var(--win-ink);border:2px solid var(--win-gold);box-shadow:0 0 0 2px var(--win-edge),3px 3px 0 2px #000;padding:5px 8px;font:14px/1.3 var(--f-text);text-align:left;white-space:normal}
.rg:hover .tip,.rg:focus-visible .tip{display:block}
.rg:nth-child(-n+3) .tip{left:0;transform:none}
.rg:nth-child(n+8) .tip{left:auto;right:0;transform:none}
.stage{position:relative;background:#000;line-height:0;border-left:6px solid var(--bar);border-right:6px solid var(--bar)}
#scene{width:100%;max-width:100%;aspect-ratio:320/200;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer}
#jumps{position:absolute;inset:0;pointer-events:none}
.jump{position:absolute;pointer-events:auto;background:transparent;border:3px solid transparent;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:0;line-height:1.2}
.jump span{transform:translateY(calc(100% + 8px));background:var(--win);color:var(--win-ink);border:2px solid var(--win-gold);padding:3px 8px;font:700 15px/1.2 var(--f-text);text-align:center;max-width:100%}
.jump:hover,.jump:focus-visible{border-color:#FFE27A;outline:none}
.hot{position:absolute;pointer-events:auto;background:transparent;border:0;padding:0;cursor:zoom-in}
.hot:focus-visible{outline:2px dashed #FFE27A;outline-offset:0}
.hover{position:absolute;left:0;right:0;top:6px;text-align:center;font:22px/1 var(--f-term);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none}
.cap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--win);color:var(--win-ink);border:4px solid var(--win-gold);box-shadow:inset 0 0 0 2px var(--win-edge);padding:12px 16px;min-height:132px;cursor:pointer;text-align:left}
.cap.narr{grid-template-columns:minmax(0,1fr)}
#portrait{width:96px;height:96px;image-rendering:pixelated;border:3px solid;border-color:#3A2810 #E8CF8E #E8CF8E #3A2810;background:#2B2140}
.cap .who{display:block;color:var(--accent);font-weight:700}
.cap.narr .who{color:var(--narr)}
.cap.narr #say{font-style:italic}
#say{display:block;font-size:20px;white-space:pre-wrap}
.cap .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:#5A4A2E}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bar);padding:6px;border:2px solid;border-color:var(--bar-hi) var(--bar-lo) var(--bar-lo) var(--bar-hi)}
.ctl button{background:#E1D3AE;border:3px solid;border-color:#FFF6DC #7A5E2C #7A5E2C #FFF6DC;padding:6px 14px;cursor:pointer;font:700 16px var(--f-text);color:#1C140A;min-height:42px}
.ctl button:disabled{opacity:.45;cursor:default}
.ctl #rs{margin-left:auto}
.ctl .place{font:20px var(--f-term);color:var(--bar-ink)}
/* the prize: GitGuardian from Lossy Inc, in a full-screen window */
#ggprize{position:fixed;inset:0;z-index:60;background:rgba(10,8,20,.7);display:grid;grid-template-rows:auto minmax(0,1fr);padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:8px}
#ggprize[hidden]{display:none}
.pzbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bar);color:var(--bar-ink);border:2px solid;border-color:var(--bar-hi) var(--bar-lo) var(--bar-lo) var(--bar-hi);padding:4px 8px;font:22px/1.1 var(--f-term)}
.pzbar button{background:#E1D3AE;border:3px solid;border-color:#FFF6DC #7A5E2C #7A5E2C #FFF6DC;padding:4px 12px;cursor:pointer;font:700 15px var(--f-text);color:#1C140A;min-height:38px}
.gghost{--f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;background:#F6F7F9;color:#1B1F29;font:14px/1.45 var(--f-ui);color-scheme:light;border-radius:8px;overflow:auto;min-height:0}
#mp{background:#F2C14E;border-color:#FFF2B0 #8A6A10 #8A6A10 #FFF2B0}
#ggprize .gg{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
@media (max-width:760px){#ggprize .gg{grid-template-columns:minmax(0,1fr)}
#ggprize .gg nav{display:none}
}
#ggprize .gg nav{background:#1B2233;border-right:1px solid #0E1320;padding:14px 10px;display:grid;align-content:start;gap:2px}
#ggprize .gg nav .ws{font:700 15px var(--f-ui);padding:4px 8px 12px;color:#fff}
#ggprize .gg nav .grp{font:600 11.5px var(--f-ui);color:#A9B1C4;padding:12px 8px 4px}
#ggprize .gg nav button{background:none;border:0;text-align:left;padding:6px 8px 6px 18px;border-radius:6px;cursor:pointer;color:#E6E9F0;font:500 13.5px var(--f-ui)}
#ggprize .gg nav button:hover{background:#262F45}
#ggprize .gg nav button[aria-current="page"]{background:#3A4560;color:#fff}
#ggprize .gg main{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
#ggprize .crumb{font:13px var(--f-ui);color:#545C6E}
#ggprize .crumb button{background:none;border:0;color:#2D3FD8;cursor:pointer;padding:0;font:inherit}
#ggprize .gg h1{margin:0;font:600 22px/1.2 var(--f-ui)}
#ggprize .hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#ggprize .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font:600 12px var(--f-ui);border:1px solid transparent;white-space:nowrap}
#ggprize .p-trig{background:#FDECEC;color:#B42318}
#ggprize .p-asg{background:#FFF3E0;color:#9A4A00}
#ggprize .p-res{background:#E7F6EC;color:#1D7A3D}
#ggprize .p-ign{background:#EEF0F4;color:#555E70}
#ggprize .p-valid{background:#FDECEC;color:#B42318}
#ggprize .p-invalid{background:#E7F6EC;color:#1D7A3D}
#ggprize .p-crit{background:#B42318;color:#fff}
#ggprize .p-tag{background:#EEF1FF;color:#33408F}
#ggprize .p-pub{background:#FFE8D6;color:#9A3412}
#ggprize .btn{background:#fff;border:1px solid #CDD2DC;border-radius:6px;padding:6px 12px;cursor:pointer;font:500 13px var(--f-ui);color:#1B1F29}
#ggprize .btn:hover{background:#F3F5F8}
#ggprize .btn.pri{background:#2D3FD8;border-color:#2D3FD8;color:#fff}
#ggprize .btn.pri:hover{background:#2533B8}
#ggprize .btn.danger{color:#B42318;border-color:#F2B8B5}
#ggprize .btn:disabled{opacity:.45;cursor:not-allowed}
#ggprize .cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){#ggprize .cols{grid-template-columns:minmax(0,1fr)}
}
#ggprize .card{background:#fff;border:1px solid #E3E6EC;border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
#ggprize .card h3{margin:0;font:600 14px var(--f-ui)}
#ggprize .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}
#ggprize .kv dt{color:#545C6E}
#ggprize .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
#ggprize table{color:inherit;font-size:inherit}

<script>
"use strict";
/* ---------------- tiny 256-colour VGA renderer ---------------- */
const W=320,H=200;
const cv=document.getElementById("scene"), cx=cv.getContext("2d");
/* palette: 6x7x6 colour cube + 4 greys = 256, like a stock VGA game palette */
const PAL=[];(()=>{const lv6=[0,51,102,153,204,255],lv7=[0,42,85,128,170,212,255];
 for(const r of lv6)for(const g of lv7)for(const b of lv6)PAL.push([r,g,b]);[[32,32,32],[96,96,96],[160,160,160],[224,224,224]].forEach(c=>PAL.push(c));})();
const LUT=new Uint8Array(32768);(()=>{for(let i=0;i<32768;i++){const r=(i>>10)<<3|4,g=((i>>5)&31)<<3|4,b=(i&31)<<3|4;let best=0,bd=1e9;
 for(let p=0;p<256;p++){const c=PAL[p],d=(c[0]-r)**2*3+(c[1]-g)**2*4+(c[2]-b)**2*2;if(d<bd){bd=d;best=p;}}LUT[i]=best;}})();
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v/16-.5)*34);
function quantize(c,w,h){const im=c.getImageData(0,0,w,h),d=im.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,o=BAYER[(y&3)*4+(x&3)];
  const r=Math.max(0,Math.min(255,d[i]+o)),g=Math.max(0,Math.min(255,d[i+1]+o)),b=Math.max(0,Math.min(255,d[i+2]+o));
  const p=PAL[LUT[(r>>3)<<10|(g>>3)<<5|(b>>3)]];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;}
 c.putImageData(im,0,0);}
let G=cx;
const R=(x,y,w,h,c)=>{G.fillStyle=c;G.fillRect(x|0,y|0,w|0,h|0);};
function grad(x,y,w,h,stops,horiz){const g=horiz?G.createLinearGradient(x,0,x+w,0):G.createLinearGradient(0,y,0,y+h);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));G.fillStyle=g;G.fillRect(x,y,w,h);}
function poly(pts,c){G.beginPath();G.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i],pts[i+1]);G.closePath();G.fillStyle=c;G.fill();}
function ell(x,y,rx,ry,c){G.beginPath();G.ellipse(x,y,rx,ry,0,0,Math.PI*2);G.fillStyle=c;G.fill();}
function ln(x1,y1,x2,y2,c,w){G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.strokeStyle=c;G.lineWidth=w||1;G.stroke();}
function glow(x,y,r,c){const g=G.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,"rgba(0,0,0,0)");G.fillStyle=g;G.fillRect(x-r,y-r,r*2,r*2);}

/* 3x5 sign font */
const F3={A:"25755",B:"65656",C:"34443",D:"65556",E:"74647",F:"74644",G:"34553",H:"55755",I:"72227",J:"11153",K:"55655",L:"44447",M:"57755",N:"65555",O:"25552",P:"65644",Q:"25573",R:"65655",S:"34216",T:"72222",U:"55557",V:"55552",W:"55775",X:"55255",Y:"55222",Z:"71247",
 "0":"75557","1":"26227","2":"61247","3":"61216","4":"55711","5":"74616","6":"34757","7":"71222","8":"75757","9":"75711",".":"00002","-":"00700","!":"22202","?":"61202",":":"02020","/":"11244","_":"00007","'":"22000","#":"57575"," ":"00000","(":"12221",")":"42224","=":"07070","+":"02720",",":"00024","@":"25645","{":"32623","}":"62326",'"':"55000"};
function txt(s,x,y,c,sc){sc=sc||1;G.fillStyle=c;s=String(s).toUpperCase();for(const ch of s){const g=F3[ch]||F3["?"];for(let r=0;r<5;r++){const v=+g[r];for(let b=0;b<3;b++)if(v&(4>>b))G.fillRect(x+b*sc,y+r*sc,sc,sc);}x+=4*sc;}}
const tw=(s,sc)=>String(s).length*4*(sc||1)-(sc||1);
function ctxt(s,cxp,y,c,sc){txt(s,Math.round(cxp-tw(s,sc)/2),y,c,sc);}

/* ---------------- the key ---------------- */
/* expressions: idle excited curious proud confused concerned sad revoked new */
function drawKey(x,y,s,ex,acc,opt){ /* x = centre, y = feet */
 opt=opt||{};const gray=ex==="revoked"||!!opt.gray;
 const gold=gray?"#9A96A6":"#F2C14E",goldD=gray?"#6E6A7C":"#B8862A",goldL=gray?"#C9C5D4":"#FFE59A",ink="#2A1A10";
 const S=v=>v*s;G.save();G.translate(x,y);
 /* shadow */ ell(0,0,S(11),S(2.5),"rgba(0,0,0,.35)");
 /* legs + boots */
 R(S(-4),S(-8),S(2),S(6),goldD);R(S(2),S(-8),S(2),S(6),goldD);
 ell(S(-4),S(-2),S(3.2),S(2),gray?"#57536A":"#6B3FA0");ell(S(4),S(-2),S(3.2),S(2),gray?"#57536A":"#6B3FA0");
 ell(S(-5),S(-2.8),S(1.2),S(.7),gray?"#8E8A9E":"#A77BD6");ell(S(3),S(-2.8),S(1.2),S(.7),gray?"#8E8A9E":"#A77BD6");
 /* shaft + teeth */
 R(S(-3),S(-28),S(6),S(21),goldD);R(S(-2),S(-28),S(4),S(21),gold);R(S(-2),S(-28),S(1),S(21),goldL);
 R(S(3),S(-18),S(4),S(3),gold);R(S(3),S(-13),S(3),S(3),gold);R(S(6),S(-18),S(1),S(3),goldD);R(S(5),S(-13),S(1),S(3),goldD);
 /* arms */
 const arm=(side,pose)=>{const sx=S(side*3),sy=S(-22);let hx,hy,ex2,ey;
  if(pose==="up"){ex2=S(side*7);ey=S(-27);hx=S(side*9);hy=S(-33);}
  else if(pose==="hip"){ex2=S(side*8);ey=S(-19);hx=S(side*4);hy=S(-15);}
  else if(pose==="droop"){ex2=S(side*5);ey=S(-16);hx=S(side*6);hy=S(-10);}
  else if(pose==="wave"){ex2=S(side*8);ey=S(-26);hx=S(side*10);hy=S(-31);}
  else if(pose==="chin"){ex2=S(side*7);ey=S(-20);hx=S(side*3);hy=S(-27);}
  else {ex2=S(side*7);ey=S(-19);hx=S(side*8);hy=S(-13);}
  G.lineCap="round";ln(sx,sy,ex2,ey,goldD,S(2.2));ln(ex2,ey,hx,hy,goldD,S(2.2));ell(hx,hy,S(1.8),S(1.8),goldL);};
 const poses={idle:["rest","rest"],excited:["up","up"],curious:["rest","chin"],proud:["hip","hip"],confused:["rest","chin"],concerned:["droop","rest"],sad:["droop","droop"],revoked:["droop","droop"],"new":["rest","wave"],peace:["rest","rest"]}[ex]||["rest","rest"];
 arm(-1,poses[0]);arm(1,poses[1]);
 /* bow (head) */
 const tilt=ex==="curious"||ex==="confused"?-0.18:0;G.rotate(tilt);
 const hy=S(-38);
 ell(0,hy,S(11),S(10.5),goldD);ell(0,hy,S(10),S(9.5),gold);ell(S(-3),hy-S(4),S(4),S(2.5),goldL);
 ell(0,hy+S(5.5),S(2.2),S(1.4),goldD); /* key hole */
 /* face */
 const eye=(ex2,open)=>{if(open==="closed"){ln(ex2-S(1.5),hy-S(1),ex2+S(1.5),hy-S(1),ink,S(.9));return;}
  if(open==="peace"){G.beginPath();G.arc(ex2,hy-S(.6),S(1.6),Math.PI*1.1,Math.PI*1.9);G.strokeStyle=ink;G.lineWidth=S(.9);G.stroke();return;}
  if(open==="x"){ln(ex2-S(1.3),hy-S(2.3),ex2+S(1.3),hy+S(.3),ink,S(.8));ln(ex2+S(1.3),hy-S(2.3),ex2-S(1.3),hy+S(.3),ink,S(.8));return;}
  const ry=open==="wide"?S(2.4):open==="low"?S(1.2):S(1.9);ell(ex2,hy-S(1),S(1.5),ry,ink);ell(ex2+S(.5),hy-S(1.8),S(.6),S(.6),"#FFF");};
 const ey={idle:"n",excited:"wide",curious:"n",proud:"low",confused:"n",concerned:"n",sad:"low",revoked:"closed",new:"wide",peace:"peace"}[ex]||"n";
 eye(S(-3.6),ey);eye(S(3.6),ex==="curious"?"wide":ey);
 if(!gray||ex==="peace"){ell(S(-6.2),hy+S(1.8),S(1.8),S(1.1),"rgba(240,110,120,.75)");ell(S(6.2),hy+S(1.8),S(1.8),S(1.1),"rgba(240,110,120,.75)");}
 /* brows */
 if(ex==="confused"){ln(S(-5),hy-S(4.5),S(-2),hy-S(4),ink,S(.7));ln(S(2),hy-S(5.5),S(5),hy-S(4),ink,S(.7));}
 if(ex==="curious"){ln(S(2),hy-S(5.6),S(5),hy-S(5),ink,S(.7));}
 if(ex==="concerned"||ex==="sad"){ln(S(-5),hy-S(3.6),S(-2),hy-S(4.6),ink,S(.7));ln(S(2),hy-S(4.6),S(5),hy-S(3.6),ink,S(.7));}
 /* mouth */
 G.beginPath();G.strokeStyle=ink;G.lineWidth=S(.8);
 const my=hy+S(2.6);
 if(ex==="excited"||ex==="new"){G.moveTo(S(-2.5),my);G.quadraticCurveTo(0,my+S(3.5),S(2.5),my);G.closePath();G.fillStyle="#8A2A3A";G.fill();}
 else if(ex==="proud"){G.moveTo(S(-2.5),my+S(.5));G.quadraticCurveTo(S(.5),my+S(2.2),S(2.8),my-S(.4));G.stroke();}
 else if(ex==="confused"){G.moveTo(S(-1.5),my+S(1));G.lineTo(S(1.5),my+S(.4));G.stroke();}
 else if(ex==="concerned"){ell(0,my+S(1),S(1.1),S(.9),ink);}
 else if(ex==="sad"||ex==="revoked"){G.moveTo(S(-2),my+S(1.6));G.quadraticCurveTo(0,my-S(.4),S(2),my+S(1.6));G.stroke();}
 else {G.moveTo(S(-2.2),my);G.quadraticCurveTo(0,my+S(2.2),S(2.2),my);G.stroke();}
 /* accessories, one per copy */
 const a=acc;
 if(a==="crown"){poly([S(-5),hy-S(9),S(-5),hy-S(13),S(-2.5),hy-S(10.5),0,hy-S(14),S(2.5),hy-S(10.5),S(5),hy-S(13),S(5),hy-S(9)],gray?"#B0ACBE":"#FFD84A");ell(0,hy-S(11),S(.9),S(.9),"#C0304A");}
 if(a==="note"){G.save();G.translate(S(5),hy-S(8));G.rotate(.25);R(-S(3),-S(3),S(7),S(6),"#FFF27A");R(-S(2),-S(1.5),S(5),S(.6),"#B0A040");R(-S(2),S(0),S(4),S(.6),"#B0A040");G.restore();}
 if(a==="hardhat"){ell(0,hy-S(8),S(9),S(4.5),"#E0B000");R(-S(11),hy-S(7),S(22),S(2),"#C09000");R(-S(1),hy-S(12.5),S(2),S(5),"#FFD84A");}
 if(a==="party"){poly([S(-4),hy-S(8.5),S(4),hy-S(8.5),S(1),hy-S(18)],"#3FA0E0");ell(S(1),hy-S(18.5),S(1.4),S(1.4),"#FF6FB0");ln(S(-2),hy-S(11),S(3),hy-S(12),"#FFE27A",S(.8));}
 if(a==="glasses"){G.lineWidth=S(.7);G.strokeStyle=ink;G.beginPath();G.arc(S(-3.6),hy-S(1),S(2.4),0,Math.PI*2);G.stroke();G.beginPath();G.arc(S(3.6),hy-S(1),S(2.4),0,Math.PI*2);G.stroke();ln(S(-1.2),hy-S(1.4),S(1.2),hy-S(1.4),ink,S(.7));}

document.addEventListener("click",e=>{const L=document.getElementById("ggprize");if(!L||L.hidden||!L.contains(e.target))return;
 const t=e.target.closest("[data-gg],[data-openinc],[data-ggmap],[data-ggtab],[data-ggt],[data-ggnav],.pzclose");if(!t)return;
 if(t.classList.contains("pzclose"))return closePrize();
 if(t.dataset.ggnav!==undefined){if(t.disabled)return;const j=GGH.i+(t.dataset.ggnav==="back"?-1:1);if(j<0||j>=GGH.stack.length)return;GGH.i=j;ggRoute=Object.assign({},GGH.stack[j]);GGH.nav=true;renderGG();return;}
 if(t.dataset.gg)ggRoute={page:t.dataset.gg};
 else if(t.dataset.openinc)ggRoute={page:"incident",id:+t.dataset.openinc,tab:"overview"};
 else if(t.dataset.ggmap)ggRoute={page:"map",id:+t.dataset.ggmap};
 else if(t.dataset.ggtab)ggRoute=Object.assign({},ggRoute,{tab:t.dataset.ggtab});
 else if(t.dataset.ggt){ggT=+t.dataset.ggt;}
 renderGG();const f=L.querySelector(`[data-ggt="${ggT}"].pri`)&&t.dataset.ggt?L.querySelector(`[data-ggt="${ggT}"]`):null;if(f)f.focus();});
document.addEventListener("keydown",e=>{const L=document.getElementById("ggprize");if(!L||L.hidden)return;if(e.key==="Escape"){e.preventDefault();closePrize();}e.stopPropagation();},true);
