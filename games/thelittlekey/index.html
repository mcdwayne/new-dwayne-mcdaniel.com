/* One painted VGA scene, one caption, three buttons. No menus: you click to live through a key's life,
   and when the key is copied you choose which key to follow. */
:root{
  --frame:#120E1C; --bar:#8E8A9E; --bar-hi:#D6D2E2; --bar-lo:#4A4658; --bar-ink:#0E0B16;
  --win:#F2E8CF; --win-ink:#1C140A; --win-edge:#6B4A1E; --win-gold:#C9A04A; --accent:#7A1F1F; --narr:#4A3A1E;
  --f-text:"Comic Sans MS","Comic Sans","Comic Neue",cursive; --f-term:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--frame);color:#EEE}
body{margin:0;font:17px/1.4 var(--f-text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{font:inherit}
:focus-visible{outline:3px solid #FFE27A;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.status{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;background:var(--bar);color:var(--bar-ink);padding:3px 10px;font:22px/1.05 var(--f-term);flex-wrap:wrap;border:2px solid;border-color:var(--bar-hi) var(--bar-lo) var(--bar-lo) var(--bar-hi)}
.strip{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.strip canvas{width:26px;height:26px;image-rendering:pixelated;border:1px solid var(--bar-lo)}
.stage{position:relative;background:#000;line-height:0;border-left:6px solid var(--bar);border-right:6px solid var(--bar)}
#scene{width:100%;max-width:100%;aspect-ratio:320/200;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer}
#jumps{position:absolute;inset:0;pointer-events:none}
.jump{position:absolute;pointer-events:auto;background:transparent;border:3px solid transparent;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:0;line-height:1.2}
.jump span{transform:translateY(calc(100% + 8px));background:var(--win);color:var(--win-ink);border:2px solid var(--win-gold);padding:3px 8px;font:700 15px/1.2 var(--f-text);text-align:center;max-width:100%}
.jump:hover,.jump:focus-visible{border-color:#FFE27A;outline:none}
.cap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--win);color:var(--win-ink);border:4px solid var(--win-gold);box-shadow:inset 0 0 0 2px var(--win-edge);padding:12px 16px;min-height:132px;cursor:pointer;text-align:left}
.cap.narr{grid-template-columns:minmax(0,1fr)}
#portrait{width:96px;height:96px;image-rendering:pixelated;border:3px solid;border-color:#3A2810 #E8CF8E #E8CF8E #3A2810;background:#2B2140}
.cap .who{display:block;color:var(--accent);font-weight:700}
.cap.narr .who{color:var(--narr)}
.cap.narr #say{font-style:italic}
#say{display:block;font-size:20px;white-space:pre-wrap}
.cap .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:#5A4A2E}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bar);padding:6px;border:2px solid;border-color:var(--bar-hi) var(--bar-lo) var(--bar-lo) var(--bar-hi)}
.ctl button{background:#E1D3AE;border:3px solid;border-color:#FFF6DC #7A5E2C #7A5E2C #FFF6DC;padding:6px 14px;cursor:pointer;font:700 16px var(--f-text);color:#1C140A;min-height:42px}
.ctl button:disabled{opacity:.45;cursor:default}
.ctl #rs{margin-left:auto}
.ctl .place{font:20px var(--f-term);color:var(--bar-ink)}
@media (max-width:560px){.cap{gap:10px;padding:10px 12px}#portrait{width:64px;height:64px}#say{font-size:18px}.jump span{font-size:12px;padding:2px 4px;transform:translateY(calc(100% + 4px))}}
</style>

<p style="margin:0;padding:6px max(16px,env(safe-area-inset-left,0px));font:20px VT323,monospace"><a href="../thelittlekey.html" style="color:#CFC8E6">‹ About this game</a></p>
<h1 class="sr">The Little Key</h1>
<div class="wrap">
  <div class="status"><span>The Little Key</span><span class="strip" id="strip" aria-label="Rings found"></span><span id="count"></span></div>
  <div class="stage"><canvas id="scene" width="320" height="200" role="img" aria-label="Scene"></canvas><div id="jumps"></div></div>
  <div class="cap" id="cap" role="button" tabindex="0" aria-live="polite"><canvas id="portrait" width="52" height="52" aria-hidden="true"></canvas><div><span class="who" id="who"></span><span id="say"></span><span class="meta"><span id="age"></span><span id="hint"></span></span></div></div>
  <div class="ctl"><button type="button" id="bk">◀ Back</button><button type="button" id="bj">Back to the last split</button><span class="place" id="place"></span><button type="button" id="rs">Start over</button></div>
</div>
<script>
"use strict";
/* ---------------- tiny 256-colour VGA renderer ---------------- */
const W=320,H=200;
const cv=document.getElementById("scene"), cx=cv.getContext("2d");
/* palette: 6x7x6 colour cube + 4 greys = 256, like a stock VGA game palette */
const PAL=[];(()=>{const lv6=[0,51,102,153,204,255],lv7=[0,42,85,128,170,212,255];
 for(const r of lv6)for(const g of lv7)for(const b of lv6)PAL.push([r,g,b]);[[32,32,32],[96,96,96],[160,160,160],[224,224,224]].forEach(c=>PAL.push(c));})();
const LUT=new Uint8Array(32768);(()=>{for(let i=0;i<32768;i++){const r=(i>>10)<<3|4,g=((i>>5)&31)<<3|4,b=(i&31)<<3|4;let best=0,bd=1e9;
 for(let p=0;p<256;p++){const c=PAL[p],d=(c[0]-r)**2*3+(c[1]-g)**2*4+(c[2]-b)**2*2;if(d<bd){bd=d;best=p;}}LUT[i]=best;}})();
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v/16-.5)*34);
function quantize(c,w,h){const im=c.getImageData(0,0,w,h),d=im.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,o=BAYER[(y&3)*4+(x&3)];
  const r=Math.max(0,Math.min(255,d[i]+o)),g=Math.max(0,Math.min(255,d[i+1]+o)),b=Math.max(0,Math.min(255,d[i+2]+o));
  const p=PAL[LUT[(r>>3)<<10|(g>>3)<<5|(b>>3)]];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;}
 c.putImageData(im,0,0);}
let G=cx;
const R=(x,y,w,h,c)=>{G.fillStyle=c;G.fillRect(x|0,y|0,w|0,h|0);};
function grad(x,y,w,h,stops,horiz){const g=horiz?G.createLinearGradient(x,0,x+w,0):G.createLinearGradient(0,y,0,y+h);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));G.fillStyle=g;G.fillRect(x,y,w,h);}
function poly(pts,c){G.beginPath();G.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i],pts[i+1]);G.closePath();G.fillStyle=c;G.fill();}
function ell(x,y,rx,ry,c){G.beginPath();G.ellipse(x,y,rx,ry,0,0,Math.PI*2);G.fillStyle=c;G.fill();}
function ln(x1,y1,x2,y2,c,w){G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.strokeStyle=c;G.lineWidth=w||1;G.stroke();}
function glow(x,y,r,c){const g=G.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,"rgba(0,0,0,0)");G.fillStyle=g;G.fillRect(x-r,y-r,r*2,r*2);}
function shade(a){R(0,0,W,H,a);}
/* 3x5 sign font */
const F3={A:"25755",B:"65656",C:"34443",D:"65556",E:"74647",F:"74644",G:"34553",H:"55755",I:"72227",J:"11153",K:"55655",L:"44447",M:"57755",N:"65555",O:"25552",P:"65644",Q:"25573",R:"65655",S:"34216",T:"72222",U:"55557",V:"55552",W:"55775",X:"55255",Y:"55222",Z:"71247",
 "0":"75557","1":"26227","2":"61247","3":"61216","4":"55711","5":"74616","6":"34757","7":"71222","8":"75757","9":"75711",".":"00002","-":"00700","!":"22202","?":"61202",":":"02020","/":"11244","_":"00007","'":"22000","#":"57575"," ":"00000","(":"12221",")":"42224","=":"07070","+":"02720",",":"00024","@":"25645","{":"32623","}":"62326",'"':"55000"};
function txt(s,x,y,c,sc){sc=sc||1;G.fillStyle=c;s=String(s).toUpperCase();for(const ch of s){const g=F3[ch]||F3["?"];for(let r=0;r<5;r++){const v=+g[r];for(let b=0;b<3;b++)if(v&(4>>b))G.fillRect(x+b*sc,y+r*sc,sc,sc);}x+=4*sc;}}
const tw=(s,sc)=>String(s).length*4*(sc||1)-(sc||1);
function ctxt(s,cxp,y,c,sc){txt(s,Math.round(cxp-tw(s,sc)/2),y,c,sc);}

/* ---------------- the key ---------------- */
/* expressions: idle excited curious proud confused concerned sad revoked new */
function drawKey(x,y,s,ex,acc,opt){ /* x = centre, y = feet */

  ["k","excited","I'm famous! They print my name in the logs!"],
  ["n","The pipeline also packs the key into a container image, in layer three of four, and ships it to the registry."]],
  split:[["ci2","Stay in the pipeline","ci","hardhat"],["dk1","The container image","docker","box"]]},

 ci2:{sc:"ci",acc:"hardhat",day:100,beats:[
  ["k","proud","Nobody ever changes me. I'm reliable!"],
  ["n","The key is revoked. The next build fails.",{d:213,g:1}],
  ["k","sad","The robots tried me 38 times today. I didn't work once. They kept trying."],
  ["n","Someone puts a new key in the config. The old one is still printed in 14,000 log lines.",{dust:1}],
  ["n","The logs are kept for 400 days. Then the old build server is shut down for good.",{d:613}],
  ["k","peace","The robots are going to sleep, and so am I. Good night, robots."]],end:"hardhat"},

 dk1:{sc:"docker",acc:"box",day:30,beats:[
  ["k","excited","Oh! Hello! I'm in a box! Layer three is so cozy!"],
  ["k","curious","Layer four is on top of me. It's a little heavy."],
  ["n","The key is revoked. Someone adds 'RUN rm' in a new layer. The file disappears from the top layer. Layer three still has it.",{d:213,g:1}],
  ["k","revoked","They painted over me. I'm still under here. I don't open anything anymore."],
  ["n","Two years later, the old image is untagged, and the registry's cleanup deletes every layer no image still uses.",{d:950,dust:1}],
  ["k","peace","Layer by layer, everything lifts away. Oh, it's so light. Goodbye, box!"]],end:"onion"}
};
const POKES={live:["Hee! That tickles!","Oop! Hi! Do you need access to something?","I'm 528 bytes of pure helpfulness!","Poke me again! I can take it. I can take ANYTHING."],
 grey:["...Hm? Oh. Hello.","I don't open anything anymore. But hi.","Poking me won't make me work again. It's nice, though."],
 peace:["Shhh. I'm resting.","Mmm. That's nice."]};

/* ---------------- state ---------------- */
let pos={node:"birth",i:0}, hist=[], got=loadRings(), poke=null, pokeN=0;
function loadRings(){try{const v=JSON.parse(localStorage.getItem("littlekey.rings2")||"[]");return Array.isArray(v)?v:[];}catch(e){return[];}}
function saveRings(){try{localStorage.setItem("littlekey.rings2",JSON.stringify(got));}catch(e){}}
/* replay a node up to beat i to get day, grey, dust */
function stateAt(p){const n=STORY[p.node];let st={day:n.day,g:false,dust:false};for(let k=0;k<=Math.min(p.i,n.beats.length-1);k++){const b=n.beats[k],o=b[b[0]==="k"?3:2]||{};if(o.d!==undefined)st.day=o.d;if(o.g)st.g=true;if(o.dust)st.dust=true;}return st;}
const atEnd=p=>p.i>=STORY[p.node].beats.length;
function ageStr(d){if(d<1)return"less than a day old";if(d<60)return d+(d===1?" day old":" days old");if(d<730)return Math.round(d/30)+" months old";return(d/365).toFixed(1).replace(".0","")+" years old";}

/* ---------------- drawing ---------------- */
function dustify(){G.save();G.globalCompositeOperation="saturation";G.fillStyle="rgb(128,128,128)";G.globalAlpha=.75;G.fillRect(0,0,W,H);G.restore();
 R(0,0,W,H,"rgba(30,22,14,.35)");
 for(let i=0;i<70;i++){const x=(i*97)%W,y=(i*57+i*i)%H;R(x,y,1,1,"rgba(220,210,190,.35)");}
 const web=(x,y,sx,sy)=>{G.strokeStyle="rgba(220,220,220,.45)";G.lineWidth=.6;for(let k=1;k<4;k++){G.beginPath();G.arc(x,y,k*9,sx,sy);G.stroke();}for(let a=0;a<4;a++){const t=sx+(sy-sx)*a/3;ln(x,y,x+Math.cos(t)*30,y+Math.sin(t)*30,"rgba(220,220,220,.45)",.6);}};
 web(0,0,0,Math.PI/2);web(W,0,Math.PI/2,Math.PI);}
function sceneInto(sc,acc,ex,st,soft){SC[sc]({copies:[]});if(st.dust)dustify();
 if(soft){G.fillStyle="rgba(255,248,232,.55)";G.fillRect(0,0,W,H);glow(POS[sc][0],POS[sc][1]-30,120,"rgba(255,255,255,.7)");}
 drawKey(POS[sc][0],POS[sc][1],1,ex,acc,{gray:st.g});}
const off=document.createElement("canvas");off.width=W;off.height=H;
function drawSplit(n){G=cx;grad(0,0,W,H,["#0E0A1C","#24183E","#3A2450"]);
 for(let i=0;i<60;i++)R((i*71)%W,(i*37+i*i*3)%H,1,1,i%5?"#8A80B0":"#FFF2C0");
 const k=n.split.length,gap=10,w=Math.floor((W-gap*(k+1))/k),h=Math.round(w*200/320),y=Math.round(104-h/2+14);
 /* the timeline forking: a thread from the top to each picture */
 const st=stateAt({node:pos.node,i:STORY[pos.node].beats.length-1});
 G.lineCap="round";
 n.split.forEach((o,j)=>{const x=gap+j*(w+gap);G.beginPath();G.moveTo(160,22);G.bezierCurveTo(160,y-20,x+w/2,30,x+w/2,y);G.strokeStyle="#C9A04A";G.lineWidth=2;G.stroke();});
 ell(160,20,7,7,"#F2C14E");ell(160,20,3,3,"#2B2140");
 n.split.forEach((o,j)=>{const x=gap+j*(w+gap);const OG=G;G=off.getContext("2d");G.clearRect(0,0,W,H);
  sceneInto(o[2],o[3],"idle",{g:false,dust:false},false);G=OG;
  R(x-3,y-3,w+6,h+6,"#2A1A08");R(x-2,y-2,w+4,h+4,"#C9A04A");G.imageSmoothingEnabled=true;G.drawImage(off,x,y,w,h);});
 quantize(cx,W,H);
 return n.split.map((o,j)=>({x:gap+j*(w+gap),y,w,h}));}
function drawEnding(rid){G=cx;const r=RINGS.find(x=>x.id===rid);
 grad(0,0,W,H,["#0A0818","#1E1640","#3A2A5A"]);for(let i=0;i<90;i++)R((i*73)%W,(i*41+i*i)%H,1,1,i%4?"#9A90C8":"#FFF6D0");
 glow(160,92,90,"rgba(255,226,150,.30)");
 const rc=document.createElement("canvas");rc.width=64;rc.height=64;drawRing(rc,r,true);G=cx;G.imageSmoothingEnabled=false;G.drawImage(rc,128,58,64,64);
 ctxt(r.title,160,22,"#FFE59A",2);ctxt(r.name,160,134,"#F4ECD8",2);ctxt(got.length+" OF 11 RINGS FOUND",160,156,"#B8AEE0",1);
 quantize(cx,W,H);}

/* ---------------- render ---------------- */
let boxes=[];
const $=id=>document.getElementById(id);
function render(){const n=STORY[pos.node];const st=stateAt(pos);
 $("jumps").innerHTML="";boxes=[];
 let who,text,ex,isKey=false,label;
 if(atEnd(pos)&&n.split){boxes=drawSplit(n);
  who="Narrator";text="Which one do you follow? (The keys will never know.)";label="The story splits into "+n.split.length+" keys.";
  n.split.forEach((o,j)=>{const b=boxes[j],bt=document.createElement("button");bt.type="button";bt.className="jump";
   bt.style.left=(b.x/W*100)+"%";bt.style.top=(b.y/H*100)+"%";bt.style.width=(b.w/W*100)+"%";bt.style.height=(b.h/H*100)+"%";
   bt.innerHTML=`<span>${o[1]}</span>`;bt.setAttribute("aria-label","Follow the key: "+o[1]);bt.onclick=e=>{e.stopPropagation();go({node:o[0],i:0});};$("jumps").appendChild(bt);});
  $("place").textContent="The story splits";}
 else if(atEnd(pos)){const r=RINGS.find(x=>x.id===n.end);if(!got.includes(r.id)){got.push(r.id);saveRings();}drawEnding(r.id);
  who="Narrator";text=`You found the ${r.name}. It belonged to ${r.copy}. ${got.length===11?"That's all eleven. Every key got to rest.":`${got.length} of 11 found. Go back to a split to follow a different key.`}`;
  label=`${r.title}. The ${r.name}.`;$("place").textContent="The end";}
 else{const b=n.beats[pos.i];const last=pos.i===n.beats.length-1;
  if(b[0]==="k"){isKey=true;ex=b[1];text=b[2];who=pos.node==="nk1"?"backup_service_02's key":"The Little Key";}else{who="Narrator";text=b[1];ex=st.g?"revoked":"idle";}
  if(poke){isKey=true;who=pos.node==="nk1"?"backup_service_02's key":"The Little Key";text=poke[1];ex=poke[0];}
  G=cx;sceneInto(n.sc,n.acc,ex,st,last&&b[1]==="peace");quantize(cx,W,H);
  label=PLACE[n.sc]+". "+(st.g?"The key is grey and still.":"The key is here.");$("place").textContent=PLACE[n.sc];}
 cv.setAttribute("aria-label",label);
 $("who").textContent=who;$("say").textContent=text;
 const pc=$("portrait");if(isKey){pc.hidden=false;const c=pc;G=c.getContext("2d");grad(0,0,52,52,["#3A2E5A","#1C1530"]);glow(26,24,26,"rgba(255,220,140,.25)");drawKey(26,92,1.55,ex,STORY[pos.node].acc,{gray:st.g});G=cx;quantize(c.getContext("2d"),52,52);}else pc.hidden=true;
 $("cap").classList.toggle("narr",!isKey);
 const split=atEnd(pos)&&!!n.split,end=atEnd(pos)&&!n.split;
 $("hint").textContent=split?"Pick a picture to follow that key.":end?"":"Click to continue · poke the key";
 $("age").textContent=end||split?"":"Key is "+ageStr(st.day);
 $("bk").disabled=!hist.length;$("bj").disabled=!hist.some(h=>atEnd(h)&&STORY[h.node].split);
 drawStrip();}
function drawStrip(){const s=$("strip");if(!s.children.length)RINGS.forEach(r=>{const c=document.createElement("canvas");c.width=32;c.height=32;c.dataset.r=r.id;c.setAttribute("role","img");s.appendChild(c);});
 [...s.children].forEach(c=>{const r=RINGS.find(x=>x.id===c.dataset.r),h=got.includes(r.id);drawRing(c,r,h);c.setAttribute("aria-label",h?r.name:"A ring not found yet");c.title=h?r.name+": "+r.title:"Not found yet";});
 $("count").textContent=got.length+" of 11 rings";}

/* ---------------- moving through the story ---------------- */
function go(p){hist.push(pos);pos=p;poke=null;render();focusMain();}
function advance(){const n=STORY[pos.node];if(atEnd(pos))return;poke=null;go({node:pos.node,i:pos.i+1});}
function back(){if(!hist.length)return;pos=hist.pop();poke=null;render();focusMain();}
function backJump(){while(hist.length){const h=hist.pop();if(atEnd(h)&&STORY[h.node].split){pos=h;break;}}poke=null;render();focusMain();}
function restart(){hist=[];pos={node:"birth",i:0};poke=null;render();focusMain();}
function focusMain(){const j=document.querySelector(".jump");if(j)j.focus({preventScroll:true});else $("cap").focus({preventScroll:true});}
function onKey(px,py){if(atEnd(pos))return false;const n=STORY[pos.node],[kx,ky]=POS[n.sc];return px>kx-14&&px<kx+14&&py>ky-52&&py<ky+2;}
function doPoke(){const st=stateAt(pos),b=STORY[pos.node].beats[pos.i],peace=b[0]==="k"&&b[1]==="peace";
 const pool=peace?POKES.peace:st.g?POKES.grey:POKES.live,ex=peace?"peace":st.g?"revoked":["excited","proud","curious","excited"][pokeN%4];
 poke=[ex,pool[pokeN++%pool.length]];render();}
cv.addEventListener("click",e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
 if(onKey(x,y)&&!poke)return doPoke();advance();});
$("cap").addEventListener("click",advance);
$("bk").onclick=back;$("bj").onclick=backJump;
$("rs").onclick=()=>{const b=$("rs");if(b.dataset.sure){delete b.dataset.sure;b.textContent="Start over";restart();}else{b.dataset.sure="1";b.textContent="Yes, start over";setTimeout(()=>{if(b.dataset.sure){delete b.dataset.sure;b.textContent="Start over";}},4000);}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&e.target.id!=="cap"&&(e.key==="Enter"||e.key===" "))return;
 if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();advance();}
 else if(e.key==="ArrowLeft"||e.key==="Backspace"){e.preventDefault();back();}
 else if(e.key.toLowerCase()==="p"&&!atEnd(pos)){doPoke();}});
render();

</script>
</body>
