<title>Don't Break Prod</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a 1990s point-and-click adventure screen. Status bar, a 320x170 pixel scene scaled up crisp,
   an icon bar, and a typed command line. Computer screens open as modern, realistic web apps inside a CRT bezel,
   so the pixel world and the real tools contrast on purpose. Single deliberate look in both themes. */
:root{
  --ega0:#000000;--ega1:#0000AA;--ega2:#00AA00;--ega3:#00AAAA;--ega4:#AA0000;--ega5:#AA00AA;--ega6:#AA5500;--ega7:#AAAAAA;
  --ega8:#555555;--ega9:#5555FF;--ega10:#55FF55;--ega11:#55FFFF;--ega12:#FF5555;--ega13:#FF55FF;--ega14:#FFFF55;--ega15:#FFFFFF;
  --frame:#1A1A2E; --bar:#AAAAAA; --bar-ink:#000000; --msg:#FFFFFF; --msg-ink:#000000; --msg-edge:#0000AA;
  --f-pix:"Pixelify Sans","Courier New",monospace; --f-term:"VT323",ui-monospace,Menlo,monospace;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--frame);color:#EEE}
body{margin:0;font:16px/1.4 var(--f-pix)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ega14);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:grid;gap:0}
.status{display:flex;justify-content:space-between;gap:8px;background:var(--bar);color:var(--bar-ink);padding:2px 8px;font:20px/1.1 var(--f-term);flex-wrap:wrap}
.stage{position:relative;background:#000;line-height:0;border-left:4px solid var(--bar);border-right:4px solid var(--bar)}
#scene{width:100%;aspect-ratio:320/170;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair}
.hover{position:absolute;left:8px;top:6px;font:20px/1 var(--f-term);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.iconbar{display:flex;gap:2px;background:var(--bar);padding:3px;flex-wrap:wrap}
.ic{display:grid;place-items:center;gap:0;min-width:64px;height:48px;padding:2px 8px;background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;cursor:pointer;color:#000;font:15px/1 var(--f-pix)}
.ic svg{width:22px;height:22px}
.ic[aria-pressed="true"]{border-color:#555 #FFF #FFF #555;background:#A0A0A0}
.ic .inv{font:12px var(--f-pix)}
.parser{display:flex;gap:6px;align-items:center;background:#000;border:4px solid var(--bar);border-top:0;padding:4px 8px}
.parser label{font:24px/1 var(--f-term);color:#fff}
.parser input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff;font:24px/1 var(--f-term);caret-color:#fff}
/* sierra message window */
.msgwrap{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(0,0,0,.25);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.msg{max-height:calc(100dvh - 24px);overflow:auto;max-width:min(560px,100%);background:var(--msg);color:var(--msg-ink);padding:14px 18px;border:3px solid var(--msg-edge);outline:3px solid var(--msg);box-shadow:0 0 0 6px var(--msg-edge);font:19px/1.35 var(--f-pix);white-space:pre-wrap;cursor:pointer}
.msg .who{display:block;color:#AA0000;font-weight:600;margin-bottom:4px}
.msg .hint{display:block;margin-top:10px;font:14px var(--f-pix);color:#555;text-align:right}
.msg.death{border-color:#AA0000;box-shadow:0 0 0 6px #AA0000;cursor:default}
.msg .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.msg button,.dlg button{background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;padding:6px 12px;cursor:pointer;font:16px var(--f-pix);color:#000}
.msg canvas,.dlg canvas{image-rendering:pixelated}
/* dialogue */
.dlg{max-height:calc(100dvh - 24px);overflow:auto;max-width:min(620px,100%);background:#FFF;color:#000;border:3px solid #0000AA;box-shadow:0 0 0 3px #FFF,0 0 0 6px #0000AA;padding:12px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font:18px/1.35 var(--f-pix)}
.dlg .opts{grid-column:1/-1;display:grid;gap:4px}
.dlg .opts button{text-align:left}
.dlg .who{color:#AA0000;font-weight:600}
@media (max-width:520px){.dlg{grid-template-columns:minmax(0,1fr)}}
/* the computer */
.pc{position:fixed;inset:0;z-index:30;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.bezel{width:min(1180px,100%);height:min(780px,100%);min-height:0;flex:none;overflow:hidden;background:#C9C1A8;border-radius:18px;padding:18px 18px 40px;box-shadow:inset 0 0 0 4px #A49C85,0 10px 30px #000;display:grid;grid-template-rows:minmax(0,1fr) auto;position:relative}
.bezel .brand{position:absolute;bottom:10px;left:24px;font:13px var(--f-pix);color:#6A644F;letter-spacing:.1em}
.bezel .off{position:absolute;bottom:8px;right:18px;background:#B8B097;border:2px solid;border-color:#E2DAC3 #7B745F #7B745F #E2DAC3;font:13px var(--f-pix);padding:2px 10px;cursor:pointer;color:#222}
.screenpc{background:#F6F7F9;border-radius:8px;overflow:hidden;display:grid;grid-template-rows:34px minmax(0,1fr);color:#1B1F29;font:14px/1.45 var(--f-ui);color-scheme:light}
.osbar{display:flex;align-items:center;gap:4px;padding:0 8px;background:#1E2230;color:#E8EAF0;font:13px var(--f-ui);overflow-x:auto}
.osbar button{background:none;border:0;color:#C9CDD8;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font:500 13px var(--f-ui)}
.osbar button[aria-pressed="true"]{background:#3A4157;color:#fff}
.osbar .badge{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:#E5484D;color:#fff;font:600 10px var(--f-ui);margin-left:4px;padding:0 4px}
.osbar .clock{margin-left:auto;padding:0 6px;color:#6A7183;white-space:nowrap}
.app{overflow:auto;min-height:0}
.sim{position:sticky;top:0;z-index:2;background:#FFF4D6;color:#5C4500;font:12px var(--f-ui);padding:3px 12px;border-bottom:1px solid #F0DCA0}
/* GitGuardian-like dashboard (structure follows the documented incident page) */
.gg{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.gg{grid-template-columns:minmax(0,1fr)}.gg nav{display:none}}
.gg nav{background:#1B2233;border-right:1px solid #0E1320;padding:14px 10px;display:grid;align-content:start;gap:2px}
.gg nav .ws{font:700 15px var(--f-ui);padding:4px 8px 12px;color:#fff}
.gg nav .grp{font:600 11.5px var(--f-ui);color:#A9B1C4;padding:12px 8px 4px}
.gg nav button{background:none;border:0;text-align:left;padding:6px 8px 6px 18px;border-radius:6px;cursor:pointer;color:#E6E9F0;font:500 13.5px var(--f-ui)}
.gg nav button:hover{background:#262F45}
.gg nav button[aria-current="page"]{background:#3A4560;color:#fff}
.gg main{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
.crumb{font:13px var(--f-ui);color:#545C6E}.crumb button{background:none;border:0;color:#2D3FD8;cursor:pointer;padding:0;font:inherit}
.gg h1{margin:0;font:600 22px/1.2 var(--f-ui)}
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font:600 12px var(--f-ui);border:1px solid transparent;white-space:nowrap}
.p-trig{background:#FDECEC;color:#B42318}.p-asg{background:#FFF3E0;color:#9A4A00}.p-res{background:#E7F6EC;color:#1D7A3D}.p-ign{background:#EEF0F4;color:#555E70}
.p-valid{background:#FDECEC;color:#B42318}.p-invalid{background:#E7F6EC;color:#1D7A3D}.p-crit{background:#B42318;color:#fff}.p-tag{background:#EEF1FF;color:#33408F}.p-pub{background:#FFE8D6;color:#9A3412}
.btn{background:#fff;border:1px solid #CDD2DC;border-radius:6px;padding:6px 12px;cursor:pointer;font:500 13px var(--f-ui);color:#1B1F29}
.btn:hover{background:#F3F5F8}.btn.pri{background:#2D3FD8;border-color:#2D3FD8;color:#fff}.btn.pri:hover{background:#2533B8}.btn.danger{color:#B42318;border-color:#F2B8B5}.btn:disabled{opacity:.45;cursor:not-allowed}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1px solid #E3E6EC;border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h3{margin:0;font:600 14px var(--f-ui)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}.kv dt{color:#545C6E}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
table{color:inherit;font-size:inherit}
table.t{border-collapse:collapse;color:#1B1F29;width:100%;font:13.5px var(--f-ui)}
table.t th{text-align:left;color:#545C6E;font:600 12px var(--f-ui);padding:8px;border-bottom:1px solid #E3E6EC;white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid #EEF0F4;vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#F7F8FB}
.tw{overflow-x:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:13.5px}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #B9C0CE;color:#545C6E;font:600 12px var(--f-ui)}
.steps li.done::before{content:"✓";background:#1D7A3D;border-color:#1D7A3D;color:#fff}
.steps li b{display:block}.steps li span{color:#545C6E}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}.tl li time{color:#545C6E;font-family:var(--f-mono);font-size:12px}
.modalbg{position:absolute;inset:0;background:rgba(17,20,30,.45);display:grid;place-items:center;z-index:5;padding:16px}
.modal{background:#fff;border-radius:12px;width:min(480px,100%);padding:18px 20px;display:grid;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.modal h2{margin:0;font:600 17px var(--f-ui)}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.modal label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.modal input[type=text],.modal select{border:1px solid #CDD2DC;border-radius:6px;padding:7px 9px;width:100%}
.warnbox{background:#FFF6E5;border:1px solid #F5D49A;color:#7A4B00;border-radius:8px;padding:10px 12px;font-size:13px}
.errbox{background:#FDECEC;border:1px solid #F5B5B0;color:#8A1C14;border-radius:8px;padding:10px 12px;font-size:13px}
.okbox{background:#E7F6EC;border:1px solid #B7E2C4;color:#155C2E;border-radius:8px;padding:10px 12px;font-size:13px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.map svg{width:100%;height:auto;background:#FAFBFD;border:1px solid #E3E6EC;border-radius:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF0F4}
/* mail */
.mail{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.mail{grid-template-columns:minmax(0,1fr)}}
.mail .list{border-right:1px solid #E3E6EC;background:#fff}
.mail .item{display:grid;gap:2px;padding:10px 14px;border-bottom:1px solid #EEF0F4;cursor:pointer;text-align:left;background:none;border-left:3px solid transparent;width:100%}
.mail .item.unread{border-left-color:#2D3FD8}.mail .item.unread b{font-weight:700}
.mail .item[aria-current="true"]{background:#EEF1FF}
.mail .item small{color:#545C6E}
.mail .read{padding:20px 24px;display:grid;gap:12px;align-content:start}
.notif{border:1px solid #E3E6EC;border-radius:10px;overflow:hidden;max-width:560px}
.notif .nh{background:#1E2340;color:#fff;padding:12px 16px;font:600 14px var(--f-ui)}
.notif .nb{padding:16px;display:grid;gap:10px;font-size:14px}
/* vault-like */
.vt{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.vt{grid-template-columns:minmax(0,1fr)}.vt nav{display:none}}
.vt nav{background:#16181F;color:#C9CDD8;padding:14px 10px;display:grid;align-content:start;gap:2px;font-size:13px}
.vt nav b{color:#fff;padding:4px 8px 12px}
.vt nav span{padding:6px 8px;border-radius:6px}.vt nav span.on{background:#2B2F3B;color:#fff}
.vt main{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
/* ai provider-like */
.ap{max-width:960px;margin:0 auto;padding:22px;display:grid;gap:14px}
.ap h1{margin:0;font:600 22px var(--f-ui)}
.ap .tabs{display:flex;gap:4px;border-bottom:1px solid #E3E6EC}
.ap .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font:500 13.5px var(--f-ui);color:#545C6E}
.ap .tabs button[aria-pressed="true"]{color:#111;border-color:#111}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid #E3E6EC;padding-top:8px}
.bars i{flex:1;background:#7D8CF0;border-radius:2px 2px 0 0;min-width:4px}.bars i.bad{background:#E5484D}
/* ci-like */
.ci{display:grid;gap:0;min-height:100%}
.ci .rh{background:#fff;border-bottom:1px solid #E3E6EC;padding:14px 22px 0;display:grid;gap:10px}
.ci .rh h1{margin:0;font:600 18px var(--f-ui)}
.ci .tabs{display:flex;gap:2px}.ci .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font:500 13.5px var(--f-ui);color:#4B5263}
.ci .tabs button[aria-pressed="true"]{border-color:#E36209;color:#111}
.ci main{padding:18px 22px;display:grid;gap:14px;align-content:start}
.run{display:grid;gap:4px;font:13px var(--f-mono);background:#0D1117;color:#C9D1D9;border-radius:8px;padding:12px 14px}
.run .ok{color:#3FB950}.run .bad{color:#F85149}
/* slack-like chat (no brand styling) */
.sl{display:grid;grid-template-columns:220px minmax(0,1fr);height:calc(100% - 24px);min-height:420px}
.sl nav{background:#1F2430;color:#C9CDD8;padding:14px 10px;display:grid;align-content:start;gap:2px;font-size:13.5px}
.sl nav .ws{font:700 15px var(--f-ui);color:#fff;padding:4px 8px 12px}.sl nav .grp{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:#8A90A2;padding:10px 8px 4px}
.sl nav .ch{padding:5px 8px;color:#8A90A2}
.sl nav button{display:flex;align-items:center;gap:8px;background:none;border:0;color:#E2E5EC;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font:500 13.5px var(--f-ui)}
.sl nav button[aria-current="true"]{background:#2D3FD8;color:#fff}.sl nav button i{width:10px;height:10px;border-radius:50%;flex:none}
.sl nav .badge{margin-left:auto;background:#E5484D;color:#fff;border-radius:8px;font:600 11px var(--f-ui);padding:0 6px}
.sl main{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0;height:100%}
.slh{padding:12px 18px;border-bottom:1px solid #E3E6EC;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:#fff}.slh span{color:#545C6E;font-size:12.5px}
.slmsgs{overflow:auto;padding:14px 18px;display:grid;gap:12px;align-content:start;min-height:120px}
.slm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;font-size:14px}.slm i{width:34px;height:34px;border-radius:8px;color:#fff;display:grid;place-items:center;font:700 14px var(--f-ui);font-style:normal}
.slm small{color:#545C6E}.slcode{background:#F3F4F7;border:1px solid #E3E6EC;border-radius:6px;padding:8px 10px;font:12.5px var(--f-mono);white-space:pre-wrap;margin:6px 0}
.slempty{color:#545C6E;font-size:13.5px;padding:16px}.sltyping{min-height:20px;padding:0 18px;color:#545C6E;font-size:12.5px;font-style:italic}
.slcompose{border-top:1px solid #E3E6EC;padding:10px 14px;display:grid;gap:8px;background:#fff}.slsugg{display:flex;flex-wrap:wrap;gap:6px}.slsugg .btn{text-align:left}
.slform{display:flex;gap:8px}.slform input{flex:1;min-width:0;border:1px solid #CDD2DC;border-radius:6px;padding:8px 10px}
@media (max-width:760px){.sl{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.sl nav{display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px}.sl nav .ws,.sl nav .grp,.sl nav .ch{display:none}.sl nav button{white-space:nowrap}}
/* nas01 terminal: green phosphor CRT, real shell + nano */
.term{position:fixed;inset:0;z-index:30;background:#050605;display:grid;place-items:center;align-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.term .crt{width:min(900px,100%);height:min(640px,calc(100dvh - 90px));display:grid;grid-template-rows:minmax(0,1fr) auto;background:radial-gradient(ellipse at center,#0E1A10 0%,#081008 70%,#040804 100%);border:14px solid #3A3A33;border-radius:18px;box-shadow:inset 0 0 60px rgba(51,255,102,.12),0 0 0 3px #22221E,0 12px 40px #000;color:#4BFF7A;font:21px/1.2 var(--f-term);text-shadow:0 0 4px rgba(75,255,122,.45);overflow:hidden;position:relative}
.term .crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.term .scr{overflow:auto;padding:14px 16px 6px;min-height:0;cursor:text}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .hl{background:#4BFF7A;color:#061006;text-shadow:none}
.term .err{color:#FF8A7A;text-shadow:0 0 4px rgba(255,120,100,.4)}
.term .dim{color:#2FAA55}
.term .note{color:#FFD866;text-shadow:0 0 4px rgba(255,216,102,.35)}
.term .tin{display:flex;gap:8px;align-items:baseline;margin:0}
.term .tin label{white-space:nowrap}
.term .tin input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#4BFF7A;font:inherit;text-shadow:inherit;caret-color:#4BFF7A;padding:0}
.term .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 10px;border-top:1px solid #1E4A2A;background:rgba(0,0,0,.35);position:relative;z-index:1}
.term .chips button,.term .nkeys button{background:transparent;color:#4BFF7A;border:1px solid #2FAA55;font:18px/1 var(--f-term);padding:4px 8px;cursor:pointer;text-shadow:inherit}
.term .chips button:hover,.term .nkeys button:hover{background:#12301A}
.term .walkaway{background:#B8B097;border:2px solid;border-color:#E2DAC3 #7B745F #7B745F #E2DAC3;font:15px var(--f-pix);padding:4px 14px;cursor:pointer;color:#222}
.term .nano{grid-template-rows:auto minmax(0,1fr) auto auto}
.term .nbar{display:flex;justify-content:space-between;gap:12px;background:#4BFF7A;color:#061006;text-shadow:none;padding:0 12px}
.term .nano textarea{background:transparent;border:0;outline:none;resize:none;color:#4BFF7A;font:inherit;text-shadow:inherit;padding:10px 14px;caret-color:#4BFF7A;min-height:0;white-space:pre;overflow:auto}
.term .nmsg{text-align:center;min-height:1.2em;padding:0 12px}
.term .nmsg:not(:empty){background:#4BFF7A;color:#061006;text-shadow:none;justify-self:center;padding:0 10px}
.term .nkeys{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 12px 10px;position:relative;z-index:1}
.term .nkeys button{border:0;padding:2px 4px}.term .nkeys b{background:#4BFF7A;color:#061006;text-shadow:none;padding:0 3px;margin-right:4px;font-weight:400}
.term .nkeys .helper{border:1px dashed #FFD866;color:#FFD866;padding:2px 8px}
/* objective strip + checklist */
.goal{display:flex;align-items:center;gap:10px;background:#0000AA;color:#FFFF55;padding:3px 8px;font:20px/1.1 var(--f-term);border-left:4px solid var(--bar);border-right:4px solid var(--bar)}
.goal.urgent{background:#AA0000;color:#FFF}
.goal .gt{flex:1;min-width:0}
.goal button{background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;color:#000;font:15px/1 var(--f-pix);padding:4px 8px;cursor:pointer;white-space:nowrap}
.pad{max-width:min(600px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#FFFFAA;color:#000;border:3px solid #0000AA;box-shadow:0 0 0 3px #FFFFAA,0 0 0 6px #0000AA;padding:14px 18px;font:20px/1.25 var(--f-term)}
.pad h2{margin:0 0 4px;font:600 20px var(--f-pix);color:#0000AA}
.pad .win{background:#0000AA;color:#FFFF55;padding:6px 10px;margin:6px 0 10px}
.pad ol{margin:0;padding-left:0;list-style:none}.pad li{margin:2px 0}.pad li.ok>span:first-child{color:#00AA00}
.pad ul{list-style:none;margin:0;padding-left:8px;color:#333}.pad ul li{margin:0}.pad .x{color:#00AA00}.pad .o{color:#AA0000}
.pad .final{margin-top:10px;border-top:2px dashed #AA5500;padding-top:8px}
.pad .btns{display:flex;justify-content:center;margin-top:10px}
.pad button{background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;padding:6px 12px;cursor:pointer;font:16px var(--f-pix);color:#000}



/* ============ LR-08: homemade Windows 3.1 workstation ============ */
.screenpc.w31{display:block;position:relative;border-radius:4px;background:#008080;background-image:radial-gradient(#0A8F8F 1px,transparent 1px);background-size:4px 4px;color:#000;overflow:hidden}
.w31 .desk{position:absolute;inset:0;overflow:hidden}
.w31 .win{position:absolute;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:#C0C0C0;border:3px solid #C0C0C0;outline:1px solid #000;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080,2px 2px 0 rgba(0,0,0,.35);min-width:220px;min-height:120px}
.w31 .win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.w31 .win.minz{display:none}
.w31 .tb{display:flex;align-items:center;gap:2px;height:22px;background:#fff;color:#000;border-bottom:1px solid #000;cursor:move;user-select:none;touch-action:none}
.w31 .win.act .tb{background:#000080;color:#fff}
.w31 .tt{flex:1;text-align:center;font:600 13px/1 var(--f-pix);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.w31 .ctl,.w31 .tbb{width:22px;height:21px;flex:none;background:#C0C0C0;border:1px solid #000;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080;color:#000;font:11px/1 var(--f-ui);padding:0;cursor:pointer;display:grid;place-items:center}
.w31 .ctl i{display:block;width:12px;height:3px;background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #808080}
.w31 .ctl:active,.w31 .tbb:active{box-shadow:inset -1px -1px 0 #fff,inset 1px 1px 0 #808080}
.w31 .mbar{display:flex;gap:0;background:#fff;border-bottom:1px solid #000;font:13px/1 var(--f-pix);padding:2px 4px}
.w31 .mbar span,.w31 .mbar button{padding:3px 8px;background:none;border:0;font:inherit;color:#000;cursor:default}
.w31 .mbar span::first-letter,.w31 .mbar button::first-letter{text-decoration:underline}
.w31 .mbar button{cursor:pointer}.w31 .mbar button:hover,.w31 .mbar button:focus-visible{background:#000080;color:#fff;outline:none}
.w31 .wbody{overflow:auto;min-height:0;background:#F6F7F9;position:relative;color:#1B1F29;font:14px/1.45 var(--f-ui);color-scheme:light}
.w31 .win .wbody .gg,.w31 .win .wbody .mail,.w31 .win .wbody .vt,.w31 .win .wbody .ci,.w31 .win .wbody .sl{min-height:100%}
.w31 .win .wbody .sl{height:100%}
.w31 .pm{display:flex;flex-wrap:wrap;gap:10px;padding:10px;background:#fff;min-height:100%;align-content:flex-start}
.w31 .grpwin{flex:1 1 220px;border:1px solid #000;background:#fff;box-shadow:inset 1px 1px 0 #C0C0C0}
.w31 .grpwin .gt{background:#fff;border-bottom:1px solid #000;text-align:center;font:600 12px/18px var(--f-pix)}
.w31 .icons{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.w31 .icon{position:relative;display:grid;justify-items:center;gap:3px;width:84px;padding:4px 2px;background:none;border:1px solid transparent;cursor:pointer;color:#000}
.w31 .icon span{font:12px/1.15 var(--f-pix);text-align:center;padding:1px 2px}
.w31 .icon:focus-visible{outline:none}.w31 .icon:focus-visible span,.w31 .icon:hover span{background:#000080;color:#fff}
.w31 .icon:focus-visible svg{outline:1px dotted #000;outline-offset:1px}
.w31 .icon .nb{position:absolute;top:0;right:14px;min-width:16px;height:16px;border-radius:8px;background:#FF0000;color:#fff;font:600 10px/16px var(--f-ui);font-style:normal;padding:0 3px}
.w31 .minicons{position:absolute;left:8px;bottom:22px;display:flex;gap:6px;flex-wrap:wrap;z-index:0}
.w31 .icon.mini span{color:#fff;background:transparent}.w31 .icon.mini:hover span,.w31 .icon.mini:focus-visible span{background:#000080}
.w31 .deskfoot{position:absolute;right:8px;bottom:4px;color:#E0FFFF;font:11px var(--f-ui);text-shadow:1px 1px 0 #004040;pointer-events:none;z-index:0;text-align:right;max-width:90%}
.w31 .w31clock{display:grid;place-items:center;align-content:center;gap:6px;height:100%;background:#fff;font:14px var(--f-pix)}
.w31 .w31clock .dig{font:44px/1 var(--f-term);color:#000080}.w31 .w31clock .hint{color:#808080;font-size:12px}
.w31 .w31note{width:100%;height:100%;border:0;resize:none;padding:8px;font:15px/1.35 var(--f-mono);background:#fff;color:#000;outline:none}
.w31 .w31sol{display:grid;place-items:center;height:100%;background:#008000}
.w31 .w31sol .msgbox{background:#C0C0C0;border:2px solid #000;padding:14px 18px;max-width:280px;font:13px var(--f-pix);box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080}
.w31 .modalbg{z-index:9999}
@media (max-width:600px){
  .screenpc.w31{border-radius:0}
  .w31 .win{left:0!important;top:0!important;width:100%!important;height:100%!important;min-width:0;border-width:0;outline:0}
  .w31 .tb{height:34px;cursor:default}.w31 .ctl,.w31 .tbb{width:34px;height:33px}.w31 .tt{font-size:15px}
  .w31 .deskfoot{display:none}
  .w31 .icon{width:30%}
}

.wbody :focus-visible{outline:3px solid #2D3FD8;outline-offset:2px}
.vt nav button.vnav{background:none;border:0;text-align:left;color:#C9CDD8;padding:6px 8px;border-radius:6px;cursor:pointer;font:13px var(--f-ui)}

function nextStep(){const st=STEPS[S.lv]||[];const n=st.find(s=>!s[1]());return n?{t:n[0],boss:/^BOSS/.test(n[0])}:{t:"Level complete",win:true};}
function stepCount(){const st=STEPS[S.lv]||[];return [st.filter(s=>s[1]()).length,st.length];}

const meter=n=>`Convinced: ${"■".repeat(n)}${"□".repeat(Math.max(0,3-n))} (${n} of 3)`;
const pc=who=>Object.keys(S.pitch[who]||{}).length;
/* a pitch option: [label, needs, works?, reply, points key] */
function pitches(who,list){const c=S.pitch[who]||(S.pitch[who]={});
  return list.filter(x=>!c[x.k]&&(!x.need||x.need())).map(x=>["▸ "+x.label,()=>{if(x.ok){c[x.k]=1;const p=award(x.pt);const n=pc(who);
    return {t:x.reply+"\n\n"+meter(n),p,win:n>=3?WIN[who]:null};}return {t:x.reply+"\n\n"+meter(pc(who))};}]);}
function talk(who){const p=PPL[who];if(who!=="kenji"||S.f.kenjiAwake)markMet(who);dialog(`${p.name} · ${p.role}`,who,INTRO[who](),()=>OPTS[who]());}

/* ----- notepad: the runbook puzzle ----- */
const RB=[["new","Create a new PayRail key. Keep the old key active."],["vault","Write the new key to Vault as a new version, production environment."],["move","Move every consumer: restart checkout-api and payouts-worker, fix recon-batch's crontab."],["quiet","Confirm the old key has no live traffic and no scheduled jobs left on it."],["revoke","Revoke the old key in PayRail."],["verify","Check validity in GitGuardian (should be Invalid) and resolve the incident."]];
const RBWHY={revoke:"Revoking before everything has moved is the classic rotation outage. Cloudflare R2, March 2025.",verify:"GitGuardian will still say Valid until the old key is actually revoked.",quiet:"There's nothing to confirm yet: nothing has moved.",move:"Consumers need somewhere to get the new key from first.",vault:"There's no new key to store yet."};
const RBMIX=["move","revoke","new","verify","quiet","vault"];
APPS.notepad=()=>{if(S.lv<3||!S.f.map3)return `<textarea class="w31note" aria-label="TODO.TXT" spellcheck="false">TODO.TXT (left by Hal)
---------------------
- read the GitGuardian alerts (where do they go??)
- figure out who owns the PayRail key
- rotation runbook (later)
- buy a chair</textarea>`;
  const done=S.f.runbook?RB.map(x=>x[0]):(S.rbPick||[]);
  return `<div style="padding:14px 16px;display:grid;gap:10px;background:#fff;min-height:100%"><b style="font:600 15px var(--f-ui)">RUNBOOK.TXT · Rotate the PayRail live key (#2871)</b>
   <div style="font-size:13px;color:#545C6E">${S.f.runbook?"Saved. Ingrid will want to see this.":"Click the steps in the order you'd do them tonight. GitGuardian's remediation workflow (Remediation tab on #2871) is a good guide."}</div>
   <ol class="steps">${done.map(k=>`<li class="done"><div><b>${esc(RB.find(x=>x[0]===k)[1])}</b></div></li>`).join("")}</ol>
   ${S.f.runbook?"":`<div style="display:grid;gap:6px">${RBMIX.filter(k=>!done.includes(k)).map(k=>`<button class="btn" style="text-align:left" data-act="rb:${k}">${esc(RB.find(x=>x[0]===k)[1])}</button>`).join("")}</div>${done.length?'<div><button class="btn" data-act="rbreset">Start over</button></div>':""}`}
   <div style="font-size:12.5px;color:#545C6E">Rollback: point Vault production back at version 1 and restart. Only possible while the old key is still active.</div></div>`;};
ACT.rb=k=>{const pick=S.rbPick||(S.rbPick=[]);const want=RB[pick.length][0];
  if(k!==want){S.rbPick=[];renderPC();return say(`Not yet. ${RBWHY[k]||"That step comes later."}\n\nThe runbook starts over.`);}
  pick.push(k);if(pick.length===RB.length){S.f.runbook=true;give("runbook");pcAct(()=>({toast:"Runbook saved",p:award("runbook")}));}else renderPC();};
ACT.rbreset=()=>{S.rbPick=[];renderPC();};

/* ----- PayRail (vendor console) ----- */
const v1rpm=()=>(effKey("checkout")==="v1"?820:0)+(effKey("payouts")==="v1"?410:0);
const v2rpm=()=>(effKey("checkout")==="v2"?820:0)+(effKey("payouts")==="v2"?410:0);
function lastUsed(k){const live=k==="v1"?v1rpm():v2rpm();if(live)return "just now";if(k==="v1")return "yesterday 2:00 AM · 10.4.2.17 (batch-01)";return "never";}
APPS.payrail=()=>{if(S.pr.v2&&S.pr.v1&&!v1rpm()&&!S.f.quiet){S.f.quiet=true;award("quiet");}
  const row=(k,lab,created)=>{const alive=k==="v1"?S.pr.v1:S.pr.v2;const rpm=k==="v1"?v1rpm():v2rpm();return `<tr><td class="mono">${lab}</td><td>${created}</td><td>${alive?pill("Active","p-res"):pill("Revoked","p-ign")}</td><td><b>${alive?rpm:0}</b> req/min</td><td class="xs">${alive?lastUsed(k):"—"}</td><td>${alive?`<button class="btn danger" data-act="prrev:${k}">Revoke</button>`:""}</td></tr>`;};
  return `<div class="ap"><h1>PayRail · Developers · API keys</h1><div class="xs">Merchant acct_PRC_88412 · Live mode</div>
   <div class="card" style="padding:0"><div class="tw"><table class="t"><tr><th>Secret key</th><th>Created</th><th>Status</th><th>Live traffic</th><th>Last used</th><th></th></tr>${row("v1",K1,"2024-09-12")}${S.pr.v2?row("v2",K2,"Today"):""}</table></div></div>
   ${S.pr.v2?"":`<div><button class="btn pri" data-act="modal:prnew">+ Create secret key</button></div>`}
   <div class="xs">Live traffic is the last 5 minutes. Scheduled jobs only show up when they run. Section 14.2 of your merchant agreement: compromised keys must be rotated within 72 hours of discovery.</div></div>`;};
ACT.prcreate=()=>{const roll=document.getElementById("prroll")&&document.getElementById("prroll").checked;modal=null;
  if(roll){S.pr.v2=true;S.pr.v1=false;die("rollnow");return pcAct(()=>({}));}
  pcAct(()=>{S.pr.v2=true;return {toast:"New key created. The old key still works.",p:award("newkey")};});};
ACT.prrev=k=>{if(k==="v2")return say("That's the new key. Revoking it would take everything down the moment you finish migrating. Leave it.");modal={k:"revoke",key:k};renderPC();};
ACT.prrevoke=k=>{modal=null;S.pr.v1=false;if(v1InUseLive()){die("down");return pcAct(()=>({}));}
  if(effKey("recon")==="v1"){pcAct(()=>({toast:"Old key revoked. Dashboards green."}));return setTimeout(()=>{PL().innerHTML="";msgBox("11:42 PM. Dashboards are green. Juni posts a thumbs up. You close the BrickBook and go home.\n\n...\n\n2:00 AM. Your phone rings.",null,()=>{die("recon");death("recon");});},300);}
  pcAct(()=>({toast:"Old key revoked. Nothing broke.",p:award("revoke")}));};

/* ----- Vault ----- */
APPS.vault=()=>{const P=S.vault.production,Dd=S.vault.default,cur=vaultProd();const val=v=>v==="v2"?K2:K1;
  const nav=`<nav><b>Vault</b><span>Secrets engines</span><button class="vnav on" aria-current="page">kv/payments/payrail</button><span>kv/payments/legacy</span><span>Policies</span></nav>`;
  return `<div class="vt">${nav}<main><div class="crumb">kv / payments / payrail</div><div class="hdr"><h1 style="margin:0;font:600 22px var(--f-ui)">payrail</h1><button class="btn" data-act="vnew" ${S.pr.v2?"":"disabled"}>Create new version</button></div>
   ${S.pr.v2?"":'<div style="font-size:12.5px;color:#545C6E">Create a new credential at the provider first.</div>'}
   <div class="card"><h3>Current version: ${P.length} · production</h3><dl class="kv"><dt>Key</dt><dd class="mono">api_key</dd><dt>Value</dt><dd class="mono">${val(cur)}  <span style="color:#545C6E">(${cur==="v1"?"the old key"+(S.pr.v1?"":", revoked"):"the new key"})</span></dd></dl></div>
   <div class="card"><h3>Version history · production</h3><div class="tw"><table class="t"><tr><th>Version</th><th>Value</th><th>Created</th></tr>${P.map((v,n)=>`<tr><td>${n+1}</td><td class="mono">${val(v)}</td><td>${n===0?"2024-09-12":"today"}</td></tr>`).reverse().join("")}</table></div></div>
   <div class="card"><h3>Environment: default</h3>${Dd.length?`<div class="tw"><table class="t"><tr><th>Version</th><th>Value</th></tr>${Dd.map((v,n)=>`<tr><td>${n+1}</td><td class="mono">${val(v)}</td></tr>`).join("")}</table></div>`:""}<div style="font-size:12.5px;color:#545C6E">Nothing reads the default environment.</div></div>
   <div class="card"><h3>Consumers reading this path</h3><div>checkout-api (production, at startup)</div><div>payouts-worker (production, at startup)</div>${S.c.recon==="vault"?"<div>recon-batch (production, at run time)</div>":""}</div></main></div>`;};
ACT.vnew=()=>{if(!S.pr.v2)return say("You don't have a new key to store yet. Create one in PayRail first.");modal={k:"vwrite"};renderPC();};
ACT.vsave=()=>{const env=document.getElementById("venv").value,val=document.getElementById("vval").value;modal=null;
  pcAct(()=>{S.vault[env].push(val);if(env==="production"&&val==="v2")return {toast:"Version saved to production",p:award("vault")};if(val==="v1")return {toast:"Saved the old key again. That doesn't rotate anything."};return {toast:"Saved to the default environment"};});};

/* ----- Deploys ----- */
APPS.deploys=()=>{const r=(k,n,how)=>`<tr><td><b>${n}</b><div class="xs">${how}</div></td><td class="mono">${effKey(k)==="v2"?K2:K1}</td><td>${S.pr.v1||effKey(k)==="v2"?pill("Healthy","p-res"):pill("Failing","p-trig")}</td><td><button class="btn" data-act="restart:${k}">Restart (rolling)</button></td></tr>`;
  return `<div class="ci"><div class="rh"><h1>Deploys · payments · production</h1></div><main><div class="card" style="padding:0"><div class="tw"><table class="t"><tr><th>Service</th><th>PAYRAIL_KEY loaded</th><th>Health</th><th></th></tr>${r("checkout","checkout-api","reads Vault kv/payments/payrail (production) at startup")}${r("payouts","payouts-worker","reads Vault kv/payments/payrail (production) at startup")}
   <tr><td><b>recon-batch</b><div class="xs">cron on batch-01, 2:00 AM · not managed here</div></td><td class="mono">${S.c.recon==="vault"?"from Vault at run time":K1+" (pasted in crontab)"}</td><td>${pill("Scheduled","p-tag")}</td><td><button class="btn" data-pc="batch">SSH to batch-01</button></td></tr></table></div></div>
   ${S.f.deployLog?`<div class="run">${S.f.deployLog.map(l=>`<div class="${/OK|healthy/.test(l)?"ok":/still/.test(l)?"bad":""}">${esc(l)}</div>`).join("")}</div>`:""}</main></div>`;};
ACT.restart=k=>pcAct(()=>{const v=vaultProd();S.c[k]=v;if(k==="checkout")S.f.restartedCheckout=true;const n=k==="checkout"?"checkout-api":"payouts-worker";
  S.f.deployLog=[`$ rollout restart deploy/${n} -n payments`,`pods 1/3 ... 2/3 ... 3/3 ready`,`PAYRAIL_KEY loaded: ${v==="v2"?K2:K1}`,v==="v2"?`${n} healthy OK`:`${n} is still on the old key: Vault production has no new version`];
  let p=0;if(effKey("checkout")==="v2"&&effKey("payouts")==="v2")p=award("deploy");return {min:3,toast:v==="v2"?`${n} restarted on the new key`:`${n} restarted, but it loaded the OLD key`,p};});

/* ============================== Slack (same as LossyInc Range's 05b-slack.js, plus one house rule) ==============================
   Same choices as talking in person. Replies take a random 2 to 200 real seconds; the game clock doesn't move while you wait.
   Pending replies are stored with an absolute due time, so they survive closing the computer and reloading the page.
   House rule: nobody at Precarium answers a DM from someone they haven't met. Talk to them in person first.
   Scripted messages (game mechanics) arrive regardless: Otto's first ping, channel posts, the change-window war room. */
const SL_COL={otto:"#AA5500",marisol:"#AA00AA",juni:"#006B6B",wendell:"#0000AA",ingrid:"#555555",kenji:"#006B00",desmond:"#5555FF",harriet:"#AA0000",paloma:"#AA00AA",victor:"#000000"};

/* who you've met in person: recorded when you talk to them, or implied by quest progress (so save codes keep it) */
function met(who){if(S.met&&S.met[who])return true;const f=S.f,pt=k=>Object.keys(S.pitch[k]||{}).length>0;
  return {otto:f.ottoWorried||f.ottoRotated||S.lv>1,marisol:S.lv>1||pt("marisol"),juni:f.juniAsk,wendell:S.lv>2||pt("wendell"),ingrid:f.ingridAsk,kenji:f.kenjiAwake,desmond:f.desAsk,harriet:f.harrietAsk,paloma:f.palAsk,victor:f.vicAsk}[who]||false;}
function markMet(who){S.met=S.met||{};S.met[who]=true;}
function slackDelay(){const o=typeof window!=="undefined"&&window.DBP_SLACK_DELAY_MS;if(o!=null)return +o;return (2+Math.floor(Math.random()*199))*1000;}
/* some things only work face to face: pitches to bosses, handing over a laptop, waking someone up */
const IN_PERSON=/^(▸|Bye$|Make a new token|Wake him up|\(Paloma)/;
function slOptions(who){if(!met(who))return [];if(who==="kenji"&&!S.f.kenjiAwake)return [];if(who==="victor"&&!S.f.palAsk)return [];
  const b=OPTS[who];return b?b().filter(o=>o[1]&&!IN_PERSON.test(o[0])):[];}
const slUnread=()=>{if(!S||!S.slack)return 0;return Object.values(S.slack.unread).reduce((a,b)=>a+b,0);};
/* turn an in-person reply ("narration" plus "quotes") into a chat message */
function chatText(t){const q=[...String(t).matchAll(/"([^"]+)"/g)].map(m=>m[1]);return (q.length?q.join(" "):String(t)).trim();}
function slSend(who,label,fnIdx){const s=SL();if(s.pending.some(p=>p.who===who&&p.label===label))return;
  s.msgs[who].push({me:true,txt:label,at:clock(S.t)});advance(1);
  if(!met(who)||(who==="kenji"&&!S.f.kenjiAwake)){save();return;}/* delivered, never answered */
  const ms=slackDelay();s.pending.push({who,label,fnIdx,due:Date.now()+ms,typingFrom:Date.now()+Math.max(0,ms-Math.min(6000,ms*0.6))});save();}
function slDeliver(p){const s=SL();s.pending=s.pending.filter(x=>x!==p);const who=p.who;let txt,pts=0;
  if(p.fnIdx==null){txt=["Can you ask me something specific? I'm a bit underwater.","👀 not sure what you mean","Sorry, in the middle of something. What do you need exactly?"][Math.floor(Math.random()*3)];}
  else{const opt=slOptions(who).find(o=>o[0]===p.label);if(!opt){txt="Already on it.";}else{const r=opt[1]()||{};txt=chatText(r.t||"👍");pts=r.p||0;}}
  s.msgs[who].push({me:false,txt,at:clock(S.t),pts});
  const viewing=document.getElementById("pcroot")&&pcApp==="slack"&&slWho===who;if(!viewing)s.unread[who]=(s.unread[who]||0)+1;
  if(document.getElementById("w31")&&!modal)renderPC();else updateBar();
  if(!viewing)flash(`Slack · ${PPL[who].name.split(" ")[0]}: ${txt.replace(/\s+/g," ").slice(0,70)}${txt.length>70?"…":""}${pts?` (+${pts})`:""}`);
  save();}

  if(document.getElementById("w31")&&pcApp==="slack"&&!modal&&slWho&&PPL[slWho]){const t=document.getElementById("sltyping");const p=S.slack.pending.find(x=>x.who===slWho);const want=p&&now>=p.typingFrom?`${PPL[slWho].name.split(" ")[0]} is typing…`:p?"Delivered":"";if(t&&t.textContent!==want)t.textContent=want;}},500);
/* scripted DMs (game mechanics): they arrive whether or not you've met */
function slScript(who,txt){const s=SL();if(s.msgs[who].some(m=>!m.me&&m.txt===txt))return;s.msgs[who].push({me:false,txt,at:clock(S.t),scripted:true});s.unread[who]=(s.unread[who]||0)+1;}

APPS.slack=function(){const s=SL();const ppl=Object.keys(PPL);if(!slWho)slWho="ch:general";const isCh=/^ch:/.test(slWho);if(!isCh&&pcApp==="slack")s.unread[slWho]=0;

/* ============================== 32-bit save codes (same system as LossyInc Range) ==============================
   A game condenses to 32 bits, shown as 8 hex digits: DBP-XXXX-XXXX.
     bits  0-2   level (0 to 5 for levels 1 to 6)
     bits  3-8   time since the level started, in 6-minute steps (0 to 63)
     bits  9-26  up to 18 milestones for the current level, in the order listed below
     bits 27-31  checksum: reported, not enforced (any code loads; a mismatch just gets a warning)
   It is lossy on purpose: it keeps what matters for play (where you are in the quest, what you've done, what you
   carry) and drops the rest (exact minute, which room you were in, dialogue order). Points are recalculated from the
   milestones. Earlier levels are rebuilt as finished: in this game you can only move up a floor by winning. */

function finishLevel(n){(MILESTONES[n]||[]).forEach(m=>{try{if(!m[1]())m[2]();}catch(e){}});
  if(n===2&&!S.f.juniTold)S.f.juniTold=true;
  if(n===5&&!(S.pitch.victor||{}).board){(S.pitch.victor||(S.pitch.victor={})).board=1;award("v3p");}
  if(n===1&&!(S.pitch.marisol||{}).ask){(S.pitch.marisol||(S.pitch.marisol={})).ask=1;award("m3");}
  silentWin(BOSS[n]);S.mail.forEach(m=>m.read=true);}
const scCheck=d=>(Math.imul(d>>>0,2654435761)>>>27)&31;
function encodeSave(){if(!S)return null;const lvl=Math.min(5,S.lv-1);const slot=Math.max(0,Math.min(63,Math.round((S.t-START_T[S.lv])/SC_SLOT)));
  let ms=0;(MILESTONES[S.lv]||[]).forEach((m,n)=>{let ok=false;try{ok=!!m[1]();}catch(e){}if(ok)ms|=1<<n;});
  const data=(lvl|(slot<<3)|(ms<<9))>>>0;const v=(data|(scCheck(data)<<27))>>>0;
  const h=v.toString(16).toUpperCase().padStart(8,"0");return `DBP-${h.slice(0,4)}-${h.slice(4)}`;}
/* Any input decodes to some game. Eight hex digits are read as the 32 bits directly; anything else is hashed (FNV-1a). */
function fnv1a(str){let h=0x811c9dc5;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function decodeSave(code){const raw=String(code||"").trim();const h=raw.toUpperCase().replace(/^DBP/,"").replace(/[^0-9A-F]/g,"");
  const exact=h.length===8&&/^(DBP)?[-\s]*[0-9A-F]{4}[-\s]*[0-9A-F]{4}$/i.test(raw.replace(/^DBP-?/i,"DBP"));
  const v=exact?parseInt(h,16)>>>0:fnv1a(raw.toUpperCase());const data=v&0x7FFFFFF;
  return {lv:Math.min(6,(data&7)+1),t:((data>>>3)&63)*SC_SLOT,ms:(data>>>9)&0x3FFFF,checksumOk:exact&&scCheck(data)===(v>>>27),hashed:!exact};}
/* Perfect-start codes: DBP-PERF-L1 to DBP-PERF-L6 start that level with every earlier level perfect.
   They're reserved words, not 32-bit codes, so normal codes keep their meaning. */
const perfectOf=code=>{const m=/^DBP[-\s]*PERF(?:ECT)?[-\s]*L?([1-6])$/i.exec(String(code||"").trim());return m?+m[1]:0;};
function rebuild(lv,keepName){S=fresh(keepName);startLevelQuiet(1);for(let n=1;n<lv;n++){finishLevel(n);startLevelQuiet(n+1);}
  if(lv>=2&&!has("laptop"))give("laptop");S.room=lv===1?"closet":FLOOR_ROOM[{2:"3",3:"4",4:"5",5:"6",6:"4"}[lv]]||"f2";if(lv===6)S.room="f4";
  const c=Object.assign({},S);delete c.ckpt;S.ckpt=JSON.stringify(c);}
function restoreFromCode(code){const keep=S&&S.player;const pd=perfectOf(code);
  if(pd){rebuild(pd,keep);save();return {lv:pd,t:0,ms:0,checksumOk:true,hashed:false,perfect:true};}
  const r=decodeSave(code);rebuild(r.lv,keep);
  (MILESTONES[r.lv]||[]).forEach((m,n)=>{if(r.ms&(1<<n)){try{m[2]();}catch(e){}}});
  S.t=START_T[r.lv]+r.t;htTick();
  /* a code can describe a boss who's already convinced: that level is won, so move up */
  const boss=BOSS[r.lv];if(boss&&Object.keys(S.pitch[boss]||{}).length>=3){finishLevel(r.lv);startLevelQuiet(r.lv+1);r.advanced=true;r.lv++;
    const c=Object.assign({},S);delete c.ckpt;S.ckpt=JSON.stringify(c);}
  /* the change window: a code can describe a revoke that already broke prod */
  if(S.lv===6&&!S.pr.v1){if(v1InUseLive())S.dead="down";else if(effKey("recon")==="v1")S.dead="recon";}
  save();return r;}
/* the code for the start of level n, shown on every level screen (same block as Lossy's end-of-day screens) */
function levelCode(n){if(!S)return "";const lv=S.lv,t=S.t;S.lv=n;S.t=Math.max(t,START_T[n]);let c;try{c=encodeSave();}finally{S.lv=lv;S.t=t;}
  return `<span class="lvcode" style="display:block;margin-top:12px;border-top:2px dashed #AAA;padding-top:8px;text-align:left"><b>Your save code</b><span style="display:block;text-align:center;font:30px/1.2 var(--f-term);letter-spacing:.06em;user-select:all" id="sccode">${c}</span>Enter it on the title screen (Enter a save code) to start level ${n} again, on any device. Anyone you give it to can load it too. There's no back end: nothing about your game is stored on a server, so write it down.<span style="display:block;margin-top:6px;text-align:center"><button data-sccopy style="background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;padding:4px 10px;font:15px var(--f-pix);color:#000">Copy code</button></span></span>`;}
function showSaveCode(){const Lr=ML();const w=document.createElement("div");w.className="msgwrap";const code=encodeSave();
  w.innerHTML=`<div class="msg" style="cursor:default" role="dialog" aria-modal="true" aria-label="Save code"><b>Save code</b>\nWrite this down. Entering it on the title screen rebuilds this game: the level, the time (to the nearest 6 minutes) and everything you've done on this level so far. Points are recalculated.\n\n<span style="display:block;text-align:center;font:34px/1.2 var(--f-term);letter-spacing:.06em;user-select:all" id="sccode">${code}</span>\nIt fits in 32 bits.<div class="btns"><button data-sccopy>Copy</button><button data-scclose>Close</button></div></div>`;Lr.appendChild(w);w.querySelector("[data-sccopy]").focus();}
function askSaveCode(){const Lr=ML();const w=document.createElement("div");w.className="msgwrap";w.id="scask";
  w.innerHTML=`<div class="msg" style="cursor:default" role="dialog" aria-modal="true" aria-label="Enter a save code"><b>Enter a save code</b>\n<form id="scform" style="display:flex;gap:8px;margin-top:8px"><label for="scin" class="sr">Save code</label><input id="scin" placeholder="DBP-XXXX-XXXX" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;font:24px var(--f-term);padding:4px 8px;text-transform:uppercase"><button type="submit">Load</button></form><div id="scerr" role="alert" style="color:#AA0000;min-height:1.4em"></div><div style="font-size:14px;color:#444">Any code loads. A real one rebuilds your game; anything else gives you some game, and maybe not the one you meant.</div><div class="btns"><button data-scclose>Cancel</button></div></div>`;Lr.appendChild(w);try{document.getElementById("scin").focus();}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest("[data-scclose]")){const w=e.target.closest(".msgwrap");if(w)w.remove();return;}
  if(e.target.closest("[data-sccopy]")){const c=(document.getElementById("sccode")||{}).textContent||"";try{navigator.clipboard.writeText(c).then(()=>flash("Copied "+c),()=>flash(c));}catch(err){flash(c);}return;}
  if(e.target.closest("[data-mn='code']")){clearMsgs();return showSaveCode();}
  if(e.target.closest("[data-tt='code']"))return askSaveCode();});
document.addEventListener("submit",e=>{if(e.target.id!=="scform")return;e.preventDefault();const v=document.getElementById("scin").value;
  if(!v.trim()){document.getElementById("scerr").textContent="Type something. Anything.";return;}
  const nm=document.getElementById("pname");const keepName=nm&&nm.value.trim();if(!S&&keepName)S={player:keepName};
  clearMsgs();const r=restoreFromCode(v);showGame();const L=LV[S.lv];
  if(r.perfect){msgBox(`Perfect start: level ${S.lv}, ${L.name}, ${hhmm(S.t)}.${S.lv>1?` Every earlier level is perfect (score ${S.score} of ${MAXSCORE} so far).`:""}\n\n${nextStep().t}.`);return;}
  const note=r.hashed?`"${v.trim()}" isn't a save code, so it was turned into one (${encodeSave()}). Who knows what you'll get.`:r.checksumOk?"":"That code doesn't check out (a typo, or made up), so this may not be the game you meant. Loaded it anyway.";
  if(S.dead){msgBox(`${note?note+"\n\n":""}It's ${hhmm(S.t)}, and the change you made already broke something.`,null,()=>death(S.dead));return;}
  if(S.f.final){msgBox(`${note?note+"\n\n":""}This code is a finished game.`,null,()=>finish());return;}
  const done=(MILESTONES[S.lv]||[]).filter(m=>{try{return m[1]();}catch(err){return false;}}).length;
  msgBox(`${note?note+"\n\n":"Restored from "+v.trim().toUpperCase()+".\n\n"}${r.advanced?"That boss was already convinced, so you're on the next level.\n\n":""}Level ${S.lv}: ${L.name}, ${hhmm(S.t)}. ${done} of this level's milestones are done. The blue bar shows what's next.`);});
Object.assign(window.GAME,{encodeSave,decodeSave,restoreFromCode,MILESTONES});

/* ---- 99-a11y.js ---- */

/* ============================== Accessibility (WCAG 2.2 AA), shared by every game ============================== */
(()=>{document.documentElement.lang="en";
  /* 1.1.1 / 4.1.2: the pixel scene is an image with a description that follows the room */
  const sc=document.getElementById("scene");if(sc){sc.setAttribute("role","img");}
  let lastLabel="";
  function describe(){if(!sc||typeof S==="undefined"||!S)return;try{const room=S.room;const spots=(typeof roomSpots==="function"?roomSpots(room):SPOTS[room])||[];
      const name=(typeof ROOMNAME!=="undefined"&&ROOMNAME[room])||room;const lab=`${name}. You can see: ${spots.filter(s=>!s.exit).map(s=>s.name).join(", ")}. Exits: ${spots.filter(s=>s.exit).map(s=>s.name).join(", ")||"none"}.`;
      if(lab!==lastLabel){sc.setAttribute("aria-label",lab);lastLabel=lab;}}catch(e){}}
  const _draw=draw;draw=function(){_draw.apply(this,arguments);describe();};
  /* 4.1.2: the room list is a named group; empty buttons get a name */
  const here=document.getElementById("here");if(here)here.setAttribute("role","group");
  const ex=document.getElementById("exitbtn");if(ex&&!ex.textContent.trim())ex.setAttribute("aria-label","Exit");
  /* 4.1.3: the next-step bar is announced politely when it changes */
  const gt=document.getElementById("goalTxt");if(gt){gt.setAttribute("aria-live","polite");gt.setAttribute("role","status");}
  /* 2.1.1: clickable table rows are reachable and usable from the keyboard */
  const fixRows=root=>{try{if(typeof document==="undefined"||!document||!document.body)return;(root||document).querySelectorAll("tr.click:not([tabindex])").forEach(t=>{t.tabIndex=0;});
    (root||document).querySelectorAll(".tw:not([tabindex]),.slmsgs:not([tabindex])").forEach(el=>{el.tabIndex=0;if(!el.getAttribute("role")){el.setAttribute("role","region");el.setAttribute("aria-label",el.classList.contains("slmsgs")?"Messages":"Table");}});}catch(e){}};
  new MutationObserver(()=>fixRows()).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("keydown",e=>{const t=e.target;if(t&&t.matches&&t.matches("tr.click")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();}});
  /* 2.2.2: animation can be turned off from the menu, not only by the OS setting */
  try{const v=localStorage.getItem("games.motion");if(v==="off")reduce=true;}catch(e){}
  new MutationObserver(()=>{if(typeof document==="undefined"||!document)return;const b=document.querySelector(".msg .btns:not(.tmenu)");if(!b||b.querySelector("[data-motion]")||!b.querySelector("[data-mn]"))return;
    const m=document.createElement("button");m.dataset.motion="1";m.textContent=reduce?"Animation: off":"Animation: on";m.setAttribute("aria-pressed",String(!reduce));b.appendChild(m);}).observe(document.getElementById("msglayer"),{childList:true,subtree:true});
  document.addEventListener("click",e=>{const b=e.target.closest("[data-motion]");if(!b)return;e.stopPropagation();reduce=!reduce;try{localStorage.setItem("games.motion",reduce?"off":"on");}catch(err){}
    b.textContent=reduce?"Animation: off":"Animation: on";b.setAttribute("aria-pressed",String(!reduce));},true);
})();
