<title>Don't Break Prod</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a 1990s point-and-click adventure screen. Status bar, a 320x170 pixel scene scaled up crisp,
   an icon bar, and a typed command line. Computer screens open as modern, realistic web apps inside a CRT bezel,
   so the pixel world and the real tools contrast on purpose. Single deliberate look in both themes. */
:root{
  --ega0:#000000;--ega1:#0000AA;--ega2:#00AA00;--ega3:#00AAAA;--ega4:#AA0000;--ega5:#AA00AA;--ega6:#AA5500;--ega7:#AAAAAA;
  --ega8:#555555;--ega9:#5555FF;--ega10:#55FF55;--ega11:#55FFFF;--ega12:#FF5555;--ega13:#FF55FF;--ega14:#FFFF55;--ega15:#FFFFFF;
  --frame:#1A1A2E; --bar:#AAAAAA; --bar-ink:#000000; --msg:#FFFFFF; --msg-ink:#000000; --msg-edge:#0000AA;
  --f-pix:"Pixelify Sans","Courier New",monospace; --f-term:"VT323",ui-monospace,Menlo,monospace;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--frame);color:#EEE}
body{margin:0;font:16px/1.4 var(--f-pix)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ega14);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:grid;gap:0}
.status{display:flex;justify-content:space-between;gap:8px;background:var(--bar);color:var(--bar-ink);padding:2px 8px;font:20px/1.1 var(--f-term);flex-wrap:wrap}
.stage{position:relative;background:#000;line-height:0;border-left:4px solid var(--bar);border-right:4px solid var(--bar)}
#scene{width:100%;aspect-ratio:320/170;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair}
.hover{position:absolute;left:8px;top:6px;font:20px/1 var(--f-term);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.iconbar{display:flex;gap:2px;background:var(--bar);padding:3px;flex-wrap:wrap}
.ic{display:grid;place-items:center;gap:0;min-width:64px;height:48px;padding:2px 8px;background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;cursor:pointer;color:#000;font:15px/1 var(--f-pix)}
.ic svg{width:22px;height:22px}
.ic[aria-pressed="true"]{border-color:#555 #FFF #FFF #555;background:#A0A0A0}
.ic .inv{font:12px var(--f-pix)}
.parser{display:flex;gap:6px;align-items:center;background:#000;border:4px solid var(--bar);border-top:0;padding:4px 8px}
.parser label{font:24px/1 var(--f-term);color:#fff}
.parser input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff;font:24px/1 var(--f-term);caret-color:#fff}
/* sierra message window */
.msgwrap{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(0,0,0,.25);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.msg{max-height:calc(100dvh - 24px);overflow:auto;max-width:min(560px,100%);background:var(--msg);color:var(--msg-ink);padding:14px 18px;border:3px solid var(--msg-edge);outline:3px solid var(--msg);box-shadow:0 0 0 6px var(--msg-edge);font:19px/1.35 var(--f-pix);white-space:pre-wrap;cursor:pointer}
.msg .who{display:block;color:#AA0000;font-weight:600;margin-bottom:4px}
.msg .hint{display:block;margin-top:10px;font:14px var(--f-pix);color:#555;text-align:right}
.msg.death{border-color:#AA0000;box-shadow:0 0 0 6px #AA0000;cursor:default}
.msg .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.msg button,.dlg button{background:#C8C8C8;border:2px solid;border-color:#FFF #555 #555 #FFF;padding:6px 12px;cursor:pointer;font:16px var(--f-pix);color:#000}
.msg canvas,.dlg canvas{image-rendering:pixelated}
/* dialogue */
.dlg{max-height:calc(100dvh - 24px);overflow:auto;max-width:min(620px,100%);background:#FFF;color:#000;border:3px solid #0000AA;box-shadow:0 0 0 3px #FFF,0 0 0 6px #0000AA;padding:12px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font:18px/1.35 var(--f-pix)}
.dlg .opts{grid-column:1/-1;display:grid;gap:4px}
.dlg .opts button{text-align:left}
.dlg .who{color:#AA0000;font-weight:600}
@media (max-width:520px){.dlg{grid-template-columns:minmax(0,1fr)}}
/* the computer */
.pc{position:fixed;inset:0;z-index:30;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.bezel{width:min(1180px,100%);height:min(780px,100%);min-height:0;flex:none;overflow:hidden;background:#C9C1A8;border-radius:18px;padding:18px 18px 40px;box-shadow:inset 0 0 0 4px #A49C85,0 10px 30px #000;display:grid;grid-template-rows:minmax(0,1fr) auto;position:relative}
.bezel .brand{position:absolute;bottom:10px;left:24px;font:13px var(--f-pix);color:#6A644F;letter-spacing:.1em}
.bezel .off{position:absolute;bottom:8px;right:18px;background:#B8B097;border:2px solid;border-color:#E2DAC3 #7B745F #7B745F #E2DAC3;font:13px var(--f-pix);padding:2px 10px;cursor:pointer;color:#222}
.screenpc{background:#F6F7F9;border-radius:8px;overflow:hidden;display:grid;grid-template-rows:34px minmax(0,1fr);color:#1B1F29;font:14px/1.45 var(--f-ui);color-scheme:light}
.osbar{display:flex;align-items:center;gap:4px;padding:0 8px;background:#1E2230;color:#E8EAF0;font:13px var(--f-ui);overflow-x:auto}
.osbar button{background:none;border:0;color:#C9CDD8;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font:500 13px var(--f-ui)}
.osbar button[aria-pressed="true"]{background:#3A4157;color:#fff}
.osbar .badge{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:#E5484D;color:#fff;font:600 10px var(--f-ui);margin-left:4px;padding:0 4px}
.osbar .clock{margin-left:auto;padding:0 6px;color:#6A7183;white-space:nowrap}
.app{overflow:auto;min-height:0}
.sim{position:sticky;top:0;z-index:2;background:#FFF4D6;color:#5C4500;font:12px var(--f-ui);padding:3px 12px;border-bottom:1px solid #F0DCA0}
/* GitGuardian-like dashboard (structure follows the documented incident page) */
.gg{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.gg{grid-template-columns:minmax(0,1fr)}.gg nav{display:none}}
.gg nav{background:#1B2233;border-right:1px solid #0E1320;padding:14px 10px;display:grid;align-content:start;gap:2px}
.gg nav .ws{font:700 15px var(--f-ui);padding:4px 8px 12px;color:#fff}
.gg nav .grp{font:600 11.5px var(--f-ui);color:#A9B1C4;padding:12px 8px 4px}
.gg nav button{background:none;border:0;text-align:left;padding:6px 8px 6px 18px;border-radius:6px;cursor:pointer;color:#E6E9F0;font:500 13.5px var(--f-ui)}
.gg nav button:hover{background:#262F45}
.gg nav button[aria-current="page"]{background:#3A4560;color:#fff}
.gg main{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
.crumb{font:13px var(--f-ui);color:#545C6E}.crumb button{background:none;border:0;color:#2D3FD8;cursor:pointer;padding:0;font:inherit}
.gg h1{margin:0;font:600 22px/1.2 var(--f-ui)}
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font:600 12px var(--f-ui);border:1px solid transparent;white-space:nowrap}
.p-trig{background:#FDECEC;color:#B42318}.p-asg{background:#FFF3E0;color:#9A4A00}.p-res{background:#E7F6EC;color:#1D7A3D}.p-ign{background:#EEF0F4;color:#555E70}
.p-valid{background:#FDECEC;color:#B42318}.p-invalid{background:#E7F6EC;color:#1D7A3D}.p-crit{background:#B42318;color:#fff}.p-tag{background:#EEF1FF;color:#33408F}.p-pub{background:#FFE8D6;color:#9A3412}
.btn{background:#fff;border:1px solid #CDD2DC;border-radius:6px;padding:6px 12px;cursor:pointer;font:500 13px var(--f-ui);color:#1B1F29}
.btn:hover{background:#F3F5F8}.btn.pri{background:#2D3FD8;border-color:#2D3FD8;color:#fff}.btn.pri:hover{background:#2533B8}.btn.danger{color:#B42318;border-color:#F2B8B5}.btn:disabled{opacity:.45;cursor:not-allowed}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1px solid #E3E6EC;border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h3{margin:0;font:600 14px var(--f-ui)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}.kv dt{color:#545C6E}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
table{color:inherit;font-size:inherit}
table.t{border-collapse:collapse;color:#1B1F29;width:100%;font:13.5px var(--f-ui)}
table.t th{text-align:left;color:#545C6E;font:600 12px var(--f-ui);padding:8px;border-bottom:1px solid #E3E6EC;white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid #EEF0F4;vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#F7F8FB}
.tw{overflow-x:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:13.5px}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #B9C0CE;color:#545C6E;font:600 12px var(--f-ui)}
.steps li.done::before{content:"✓";background:#1D7A3D;border-color:#1D7A3D;color:#fff}
.steps li b{display:block}.steps li span{color:#545C6E}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}.tl li time{color:#545C6E;font-family:var(--f-mono);font-size:12px}
.modalbg{position:absolute;inset:0;background:rgba(17,20,30,.45);display:grid;place-items:center;z-index:5;padding:16px}
.modal{background:#fff;border-radius:12px;width:min(480px,100%);padding:18px 20px;display:grid;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.modal h2{margin:0;font:600 17px var(--f-ui)}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.modal label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.modal input[type=text],.modal select{border:1px solid #CDD2DC;border-radius:6px;padding:7px 9px;width:100%}
.warnbox{background:#FFF6E5;border:1px solid #F5D49A;color:#7A4B00;border-radius:8px;padding:10px 12px;font-size:13px}
.errbox{background:#FDECEC;border:1px solid #F5B5B0;color:#8A1C14;border-radius:8px;padding:10px 12px;font-size:13px}
.okbox{background:#E7F6EC;border:1px solid #B7E2C4;color:#155C2E;border-radius:8px;padding:10px 12px;font-size:13px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.map svg{width:100%;height:auto;background:#FAFBFD;border:1px solid #E3E6EC;border-radius:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF0F4}
/* mail */
.mail{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.mail{grid-template-columns:minmax(0,1fr)}}
.mail .list{border-right:1px solid #E3E6EC;background:#fff}
.mail .item{display:grid;gap:2px;padding:10px 14px;border-bottom:1px solid #EEF0F4;cursor:pointer;text-align:left;background:none;border-left:3px solid transparent;width:100%}
.mail .item.unread{border-left-color:#2D3FD8}.mail .item.unread b{font-weight:700}
.mail .item[aria-current="true"]{background:#EEF1FF}
.mail .item small{color:#545C6E}
.mail .read{padding:20px 24px;display:grid;gap:12px;align-content:start}
.notif{border:1px solid #E3E6EC;border-radius:10px;overflow:hidden;max-width:560px}
.notif .nh{background:#1E2340;color:#fff;padding:12px 16px;font:600 14px var(--f-ui)}
.notif .nb{padding:16px;display:grid;gap:10px;font-size:14px}
/* vault-like */
.vt{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.vt{grid-template-columns:minmax(0,1fr)}.vt nav{display:none}}
.vt nav{background:#16181F;color:#C9CDD8;padding:14px 10px;display:grid;align-content:start;gap:2px;font-size:13px}
.vt nav b{color:#fff;padding:4px 8px 12px}
.vt nav span{padding:6px 8px;border-radius:6px}.vt nav span.on{background:#2B2F3B;color:#fff}
.vt main{padding:18px 22px;display:grid;gap:14px;align-content:start;min-width:0}
/* ai provider-like */
.ap{max-width:960px;margin:0 auto;padding:22px;display:grid;gap:14px}
.ap h1{margin:0;font:600 22px var(--f-ui)}
.ap .tabs{display:flex;gap:4px;border-bottom:1px solid #E3E6EC}
.ap .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font:500 13.5px var(--f-ui);color:#545C6E}
.ap .tabs button[aria-pressed="true"]{color:#111;border-color:#111}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid #E3E6EC;padding-top:8px}
.bars i{flex:1;background:#7D8CF0;border-radius:2px 2px 0 0;min-width:4px}.bars i.bad{background:#E5484D}
/* ci-like */
.ci{display:grid;gap:0;min-height:100%}
.ci .rh{background:#fff;border-bottom:1px solid #E3E6EC;padding:14px 22px 0;display:grid;gap:10px}
.ci .rh h1{margin:0;font:600 18px var(--f-ui)}
.ci .tabs{display:flex;gap:2px}.ci .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font:500 13.5px var(--f-ui);color:#4B5263}
.ci .tabs button[aria-pressed="true"]{border-color:#E36209;color:#111}
.ci main{padding:18px 22px;display:grid;gap:14px;align-content:start}
.run{display:grid;gap:4px;font:13px var(--f-mono);background:#0D1117;color:#C9D1D9;border-radius:8px;padding:12px 14px}
.run .ok{color:#3FB950}.run .bad{color:#F85149}
/* slack-like chat (no brand styling) */
.sl{display:grid;grid-template-columns:220px minmax(0,1fr);height:calc(100% - 24px);min-height:420px}
.sl nav{background:#1F2430;color:#C9CDD8;padding:14px 10px;display:grid;align-content:start;gap:2px;font-size:13.5px}
.sl nav .ws{font:700 15px var(--f-ui);color:#fff;padding:4px 8px 12px}.sl nav .grp{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:#8A90A2;padding:10px 8px 4px}
.sl nav .ch{padding:5px 8px;color:#8A90A2}
.sl nav button{display:flex;align-items:center;gap:8px;background:none;border:0;color:#E2E5EC;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font:500 13.5px var(--f-ui)}
.sl nav button[aria-current="true"]{background:#2D3FD8;color:#fff}.sl nav button i{width:10px;height:10px;border-radius:50%;flex:none}
.sl nav .badge{margin-left:auto;background:#E5484D;color:#fff;border-radius:8px;font:600 11px var(--f-ui);padding:0 6px}
.sl main{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0;height:100%}
.slh{padding:12px 18px;border-bottom:1px solid #E3E6EC;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:#fff}.slh span{color:#545C6E;font-size:12.5px}
.slmsgs{overflow:auto;padding:14px 18px;display:grid;gap:12px;align-content:start;min-height:120px}
.slm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;font-size:14px}.slm i{width:34px;height:34px;border-radius:8px;color:#fff;display:grid;place-items:center;font:700 14px var(--f-ui);font-style:normal}
.slm small{color:#545C6E}.slcode{background:#F3F4F7;border:1px solid #E3E6EC;border-radius:6px;padding:8px 10px;font:12.5px var(--f-mono);white-space:pre-wrap;margin:6px 0}
.slempty{color:#545C6E;font-size:13.5px;padding:16px}.sltyping{min-height:20px;padding:0 18px;color:#545C6E;font-size:12.5px;font-style:italic}
.slcompose{border-top:1px solid #E3E6EC;padding:10px 14px;display:grid;gap:8px;background:#fff}.slsugg{display:flex;flex-wrap:wrap;gap:6px}.slsugg .btn{text-align:left}
.slform{display:flex;gap:8px}.slform input{flex:1;min-width:0;border:1px solid #CDD2DC;border-radius:6px;padding:8px 10px}
@media (max-width:760px){.sl{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.sl nav{display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px}.sl nav .ws,.sl nav .grp,.sl nav .ch{display:none}.sl nav button{white-space:nowrap}}
/* nas01 terminal: green phosphor CRT, real shell + nano */
.term{position:fixed;inset:0;z-index:30;background:#050605;display:grid;place-items:center;align-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.term .crt{width:min(900px,100%);height:min(640px,calc(100dvh - 90px));display:grid;grid-template-rows:minmax(0,1fr) auto;background:radial-gradient(ellipse at center,#0E1A10 0%,#081008 70%,#040804 100%);border:14px solid #3A3A33;border-radius:18px;box-shadow:inset 0 0 60px rgba(51,255,102,.12),0 0 0 3px #22221E,0 12px 40px #000;color:#4BFF7A;font:21px/1.2 var(--f-term);text-shadow:0 0 4px rgba(75,255,122,.45);overflow:hidden;position:relative}
.term .crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.term .scr{overflow:auto;padding:14px 16px 6px;min-height:0;cursor:text}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .hl{background:#4BFF7A;color:#061006;text-shadow:none}
.term .err{color:#FF8A7A;text-shadow:0 0 4px rgba(255,120,100,.4)}
.term .dim{color:#2FAA55}
.term .note{color:#FFD866;text-shadow:0 0 4px rgba(255,216,102,.35)}
.term .tin{display:flex;gap:8px;align-items:baseline;margin:0}
.term .tin label{white-space:nowrap}
.term .tin input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#4BFF7A;font:inherit;text-shadow:inherit;caret-color:#4BFF7A;padding:0}
.term .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 10px;border-top:1px solid #1E4A2A;background:rgba(0,0,0,.35);position:relative;z-index:1}
.term .chips button,.term .nkeys button{background:transparent;color:#4BFF7A;border:1px solid #2FAA55;font:18px/1 var(--f-term);padding:4px 8px;cursor:pointer;text-shadow:inherit}
.term .chips button:hover,.term .nkeys button:hover{background:#12301A}
.term .walkaway{background:#B8B097;border:2px solid;border-color:#E2DAC3 #7B745F #7B745F #E2DAC3;font:15px var(--f-pix);padding:4px 14px;cursor:pointer;color:#222}
.term .nano{grid-template-rows:auto minmax(0,1fr) auto auto}
.term .nbar{display:flex;justify-content:space-between;gap:12px;background:#4BFF7A;color:#061006;text-shadow:none;padding:0 12px}
.term .nano textarea{background:transparent;border:0;outline:none;resize:none;color:#4BFF7A;font:inherit;text-shadow:inherit;padding:10px 14px;caret-color:#4BFF7A;min-height:0;white-space:pre;overflow:auto}
.term .nmsg{text-align:center;min-height:1.2em;padding:0 12px}
.term .nmsg:not(:empty){background:#4BFF7A;color:#061006;text-shadow:none;justify-self:center;padding:0 10px}
.term .nkeys{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 12px 10px;position:relative;z-index:1}
.term .nkeys button{border:0;padding:2px 4px}.term .nkeys b{background:#4BFF7A;color:#061006;text-shadow:none;padding:0 3px;margin-right:4px;font-weight:400}
.term .nkeys .helper{border:1px dashed #FFD866;color:#FFD866;padding:2px 8px}
/* objective strip + checklist */
.goal{display:flex;align-items:center;gap:10px;background:#0000AA;color:#FFFF55;padding:3px 8px;font:20px/1.1 var(--f-term);border-left:4px solid var(--bar);border-right:4px solid var(--bar)}
