<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitGuardian 1-Question Interview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #f7faff;
      background:
        radial-gradient(circle at 15% 10%, #7b44dc 0, transparent 35%),
        radial-gradient(circle at 85% 90%, #4d218f 0, transparent 38%),
        #1f0b3d;
    }

    main {
      width: min(100% - 2rem, 64rem);
      margin-inline: auto;
      padding: clamp(2.5rem, 7vw, 5rem) 0;
      text-align: center;
    }

    img {
      width: min(15.5rem, 70vw);
      height: auto;
    }

    h1 {
      margin: 2rem 0 0.5rem;
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #d8c8ff;
      font-size: clamp(1.05rem, 2.5vw, 1.5rem);
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 20rem));
      justify-content: center;
      gap: clamp(1rem, 3vw, 2rem);
      margin-top: clamp(2.5rem, 6vw, 4rem);
    }

    iframe {
      width: 100%;
      aspect-ratio: 9 / 16;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: 1rem;
      background: #11051f;
      box-shadow: 0 1.5rem 4rem rgb(8 0 20 / 35%);
    }

    @media (max-width: 42rem) {
      .videos {
        grid-template-columns: minmax(0, 22rem);
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="img/gitguardian-logo.svg" alt="GitGuardian">
    <h1>GitGuardian 1-Question Interview</h1>
    <p>Got 1 minute, let's have a conversation</p>
    <div class="videos">
      <iframe src="https://www.youtube-nocookie.com/embed/NcQYx1UPXS4" title="What not to do with AI agents on your local machine" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      <iframe src="https://www.youtube-nocookie.com/embed/Ly1mGsBh1fQ" title="How to deal with credentials risk when deploying AI" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </main>
</body>
</html>
